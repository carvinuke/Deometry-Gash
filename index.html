<!doctype html>

<title>Deometry Gash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Optional game font; offline the game falls back to a system font. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b14; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #devPanel[hidden] { display: none; }
  #devPanel { position: fixed; z-index: 20; inset: 10px auto 10px 10px; width: min(720px, calc(100vw - 20px)); overflow: auto; box-sizing: border-box; padding: 14px; border: 1px solid #6254a8; border-radius: 12px; background: rgba(12, 11, 24, .97); color: #f5f3ff; font: 13px/1.35 system-ui, sans-serif; box-shadow: 0 10px 40px #0009; }
  #devPanel * { box-sizing: border-box; }
  #devPanel h2 { margin: 0; font-size: 18px; }
  #devPanel .dev-row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin: 9px 0; }
  #devPanel button, #devPanel select, #devPanel input { border: 1px solid #554b7b; border-radius: 6px; background: #211d36; color: #fff; padding: 6px 8px; font: inherit; }
  #devPanel button { cursor: pointer; }
  #devPanel button:hover, #devPanel button:focus-visible { border-color: #ffd400; }
  #devPanel .dev-palette { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
  #devPanel .dev-palette button { min-width: 34px; height: 31px; padding: 3px 7px; }
  #devPanel .dev-palette button[aria-pressed="true"] { background: #6651b6; border-color: #ffd400; }
  #devPanel .dev-grid-wrap { overflow-x: auto; padding: 6px 0; }
  #devPanel .dev-grid { display: grid; grid-template-columns: repeat(20, 29px); gap: 2px; width: max-content; }
  #devPanel .dev-cell { width: 29px; height: 29px; padding: 0; font-weight: 700; }
  #devPanel .dev-cell[data-tile="#"] { background: #45405c; }
  #devPanel .dev-cell[data-tile="^"], #devPanel .dev-cell[data-tile="G"], #devPanel .dev-cell[data-tile="v"], #devPanel .dev-cell[data-tile="h"], #devPanel .dev-cell[data-tile="F"] { color: #ff8c9e; }
  #devPanel .dev-muted { color: #b8b2ce; }
  #devPanel .dev-actions { position: sticky; bottom: -14px; background: #100e20; padding: 9px 0 2px; }
  #devPanel .dev-primary { border-color: #ffd400; color: #ffd400; }
  @media (max-width: 500px) { #devPanel { font-size: 12px; padding: 9px; } #devPanel .dev-grid { grid-template-columns: repeat(20, 25px); } #devPanel .dev-cell { width: 25px; height: 27px; } }
</style>
</head>
<body>

  <div class="dev-row" style="justify-content:space-between">
    <div><h2>Developer panel</h2><div class="dev-muted">Local dev tools · save changes in this browser or export a portable ZIP.</div></div>
    <button id="devClose" type="button">Close</button>
  </div>
  <div class="dev-row">
    <label for="devLevel">Level</label><select id="devLevel"></select>
    <label for="devOffset">Column</label><input id="devOffset" type="number" min="0" value="0" style="width:76px">
    <button id="devPrev" type="button">◀ 20</button><button id="devNext" type="button">20 ▶</button>
  </div>
  <div class="dev-row"><span>Selected tile:</span><strong id="devTileName">Small spike</strong><span class="dev-muted">Tap a grid tile to paint it.</span></div>
  <div id="devPalette" class="dev-palette" aria-label="Tile palette"></div>
  <div class="dev-grid-wrap"><div id="devGrid" class="dev-grid" aria-label="Level tile grid"></div></div>

  <div id="devStatus" class="dev-muted" role="status">Changes are not saved until you press Save level.</div>

function fit() {
  const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight), s = Math.min(w / W, h / H);
  const dpr = Math.min(2, window.devicePixelRatio || 1, Math.sqrt(4e6 / (w * h))); // crisp on high-DPI screens, but capped near 4 megapixels to keep 60 fps
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  VIEW = { s, k: s * dpr, x: (w / s - W) / 2, y: (h / s - H) / 2 };
}

// Level tiles: '#' block, '^' spike, 'v' chained hanging spike, 'h' chained spike bar, 'F' falling spike, 's' saw, 'G' giant spike, 'i' beat-pulsing pole light,
// 'p' yellow jump pad, 'r' red jump pad, 'o' jump orb (press while touching),
// 'b' cyan boost orb, 'c' secret coin, portals 'S' ship, 'C' cube, 'B' ball, 'W' wave, '.' empty. seg() takes rows top to bottom; the last
// row sits on the ground. Short rows are padded with '.' on the right.
const PORTAL_MODE = { S: 'ship', C: 'cube', B: 'ball', W: 'wave' };
const NEW_LEVEL_TILES = new Set(['h', 'F', 's', 'G', 'i']); // keep existing coin/orb IDs stable when adding hazards and scenery
function seg(...rows) {
  const w = Math.max(...rows.map(r => r.length));
  while (rows.length < ROWS) rows.unshift('');
  return rows.map(r => r.padEnd(w, '.'));
}
const gap = n => seg('.'.repeat(n));

function buildLevel(name, difficulty, stars, hue, segs) {
  segs.forEach((s, i) => console.assert(s.length === ROWS, `${name}: segment ${i} has more than ${ROWS} rows`));
  const rows = [...Array(ROWS)].map((_, r) => segs.map(s => s[r]).join(''));
  const tiles = [];
  let nextId = 0;
  rows.forEach((row, r) => [...row].forEach((c, x) => {
    if (c !== '.' && !NEW_LEVEL_TILES.has(c)) tiles.push({ id: nextId++, x, y: ROWS - 1 - r, type: c });
  }));
  rows.forEach((row, r) => [...row].forEach((c, x) => {
    if (NEW_LEVEL_TILES.has(c)) tiles.push({ id: nextId++, x, y: ROWS - 1 - r, type: c });
  }));
  // Precompute what the renderer needs: which block edges are exposed (so stacked blocks
  // outline as one shape), and how tall each portal is (only its top tile draws it).
  const at = new Map(tiles.map(t => [`${t.x},${t.y}`, t.type]));
  const is = (x, y, type) => at.get(`${x},${y}`) === type;
  for (const t of tiles) {
    if (t.type === '#') t.open = { top: !is(t.x, t.y + 1, '#'), bottom: !is(t.x, t.y - 1, '#'), left: !is(t.x - 1, t.y, '#'), right: !is(t.x + 1, t.y, '#') };
    if (t.type === 'v') t.chainTop = !is(t.x, t.y + 1, 'v');
    if (t.type in PORTAL_MODE && !is(t.x, t.y + 1, t.type)) {
      let n = 1;
      while (is(t.x, t.y - n, t.type)) n++;
      t.tall = n;
    }
  }
  const columns = new Map();
  for (const t of tiles) {
    if (!columns.has(t.x)) columns.set(t.x, []);
    columns.get(t.x).push(t);
  }
  return { name, difficulty, stars, hue, tiles, columns, len: rows[0].length, coinTiles: tiles.filter(t => t.type === 'c') };
}

// Advances one frame. Returns 'dead', 'win' or null. Only mutates p, so tests can drive it.
// The cube jumps, the ship flies up while held, the ball flips its gravity and the wave climbs while held.
// Every mode but the cube has a ceiling and can slide along the underside of blocks.
function step(p, hold, lvl, justPressed = hold) {
  const m = p.mode;
  if (justPressed) p.jumpBuffer = 0.1;
  else p.jumpBuffer = Math.max(0, p.jumpBuffer - DT);
  if (p.grounded) p.coyote = 0.1;
  else p.coyote = Math.max(0, p.coyote - DT);
  if (m === 'cube' && (hold || p.jumpBuffer > 0) && (p.grounded || p.coyote > 0)) {
    p.vy = JUMP; p.grounded = false; p.coyote = 0; p.jumpBuffer = 0;
  }
  if (m === 'ball' && hold && p.grounded) { p.grav = -p.grav; p.vy = -p.grav * BALL_KICK; }
  const prevY = p.y;
  p.x += SPEED * DT;
  if (m === 'ship') p.vy = clamp(p.vy + (hold ? SHIP_UP : -SHIP_DOWN) * DT, SHIP_MAX);
  else if (m === 'wave') p.vy = hold ? WAVE : -WAVE;
  else if (m === 'ball') p.vy = clamp(p.vy - BALL_G * p.grav * DT, BALL_MAX);
  else p.vy += GRAVITY * DT;
  p.y += p.vy * DT;
  const flipped = m === 'ball' && p.grav < 0; // a flipped ball stands on ceilings
  p.grounded = false;
  if (p.y <= 0) { p.y = 0; p.vy = 0; p.grounded = !flipped; }
  if (m !== 'cube' && p.y >= ROWS - 1) { p.y = ROWS - 1; p.vy = 0; p.grounded = flipped; }

  const candidates = [];
  const columns = lvl.columns;
  if (columns) {
    const first = Math.max(0, Math.floor(p.x) - 1);
    const last = Math.floor(p.x + 1) + 1;
    for (let x = first; x <= last; x++) candidates.push(...(columns.get(x) || []));
    candidates.sort((a, b) => a.id - b.id);
  } else candidates.push(...lvl.tiles);

    if (p.x + 1 <= t.x + 0.001 || p.x >= t.x + 1 - 0.001) continue;
    const inX = (a, b) => p.x + 1 > t.x + a && p.x < t.x + b;
    const inY = (a, b) => p.y < t.y + b && p.y + 1 > t.y + a;

      case 'v': if (!devNoclip && inX(0.35, 0.65) && inY(0.7, 1)) return 'dead'; break;
      case 'h': if (!devNoclip && inX(0.04, 0.96) && p.y < t.y + 0.42 && p.y + 1 > t.y) return 'dead'; break;
      case 'G': if (!devNoclip && inX(-0.3, 1.3) && p.y < t.y + 0.68 && p.y + 1 > t.y) return 'dead'; break;
      case 's': {
        const closestX = Math.max(t.x, Math.min(t.x + 1, p.x + 0.5));
        const closestY = Math.max(t.y, Math.min(t.y + 1, p.y + 0.5));

      }

      case 'c': if (inY(0, 1) && !p.coins.includes(t.id)) p.coins = [...p.coins, t.id]; break;
      case 'S': case 'C': case 'B': case 'W': {
        const to = PORTAL_MODE[t.type];
        if (p.mode !== to) {
          if (to === 'ship') p.vy = Math.min(p.vy, 4);

      }
      case '#':

        else return 'dead'; // hit a wall (or a ceiling as the cube)
    }
  }
  if (p.mode === 'ship') p.rot = -p.vy * 0.05;
  else if (p.mode === 'wave') p.rot = p.vy > 0 ? -Math.PI / 4 : p.vy < 0 ? Math.PI / 4 : 0;
  else if (p.mode === 'ball') p.rot += p.grav * 12 * DT;
  else p.rot = p.grounded ? Math.round(p.rot / (Math.PI / 2)) * (Math.PI / 2) : p.rot + 7 * DT;
  return p.x >= lvl.len ? 'win' : null;
}

  emit(particles, { x, y, ring: 5, life: 0.35, color, add: true });
  spray(particles, n, x, y, 6, { color, add: true, shrink: true, size: 5 });
}

// Cosmetic effects for what happened during the last physics step.
function playEffects(prev) {
  const p = player, color = mainColor(skin(p.mode));
  if (p.mode === 'cube') {
    if (prev.grounded && !p.grounded && p.vy > 0) {
      spray(particles, 6, p.x + 0.5, p.y + 0.05, 3, { color: 'rgba(255,255,255,0.7)', size: 4, life: 0.3, g: -10 });
      if (p.vy !== PAD && p.vy !== RED_PAD) sfx('jump');
      if (++save.jumps >= 1000) unlockSecret('jumps');
    } else if (!prev.grounded && p.grounded) spray(particles, 8, p.x + 0.5, p.y + 0.05, 4, { color: 'rgba(255,255,255,0.6)', size: 4, life: 0.25 });
    if (p.grounded && Math.random() < 0.7) emit(particles, { x: p.x + 0.05, y: p.y + 0.08, vx: -3 - Math.random() * 2, vy: 0.5 + Math.random() * 1.5, life: 0.35, size: 5, color, shrink: true, add: true });
  } else if (p.mode === 'ship') {
    emit(particles, { x: p.x - 0.05, y: p.y + 0.38, vx: -9 + Math.random() * 3, vy: (Math.random() - 0.5) * 2, life: 0.22, size: 8, color: holding ? '#ffc34d' : '#ff7a1a', add: true, shrink: true });
    if (Math.random() < 0.35) emit(particles, { x: p.x - 0.1, y: p.y + 0.38, vx: -5, vy: (Math.random() - 0.3) * 1.5, life: 0.7, size: 10, color: 'rgba(210,210,230,0.25)', shrink: true });
  } else if (p.mode === 'ball') {
    const contact = p.y + (p.grav > 0 ? 0.05 : 0.95);
    if (p.grav !== prev.grav) { spray(particles, 8, p.x + 0.5, p.y + (p.grav > 0 ? 0.95 : 0.05), 4, { color: 'rgba(255,255,255,0.7)', size: 4, life: 0.3 }); sfx('flip'); }
    if (p.grounded && Math.random() < 0.6) emit(particles, { x: p.x + 0.2, y: contact, vx: -3 - Math.random() * 2, vy: p.grav * (0.5 + Math.random()), life: 0.3, size: 4, color, shrink: true, add: true });
  }
  emitTrail(particles, p.x + 0.5, p.y + 0.5, skin('trail').name, color);
  if (p.used.length > prev.used) { const o = level.tiles[p.used[p.used.length - 1]]; burstAt(o.x + 0.5, o.y + 0.5, o.type === 'b' ? '#45edff' : '#ffd400'); sfx('orb'); }
  if ((p.vy === PAD || p.vy === RED_PAD) && prev.vy !== p.vy) { burstAt(p.x + 0.5, p.y + 0.1, p.vy === RED_PAD ? '#ff4545' : '#ffd400'); sfx('pad'); }
  if (p.coins.length > prev.coins) { const c = level.tiles[p.coins[p.coins.length - 1]]; burstAt(c.x + 0.5, c.y + 0.5, '#ffcc33', 18); sfx('coin'); }
  if (p.mode !== prev.mode) { burstAt(p.x + 0.5, p.y + 0.5, MODE_COLOR[p.mode], 16); sfx('portal'); }
}

function finishLevel() {
  song = null; sfx('win');
  const firstClear = !beaten(selected);
  const had = save.coins[selected] || [];
  const coins = [...new Set([...had, ...player.coins])];
  save.best[selected] = 100; save.coins[selected] = coins; persist();
  const notes = [];
  if (firstClear) notes.push(`+${level.stars} ★`);
  if (coins.length > had.length) notes.push(`+${coins.length - had.length} ◉`);
  const got = firstClear ? KINDS.flatMap(k => ITEMS[k].filter(it => it.level === selected).map(it => it.name)) : [];
  if (got.length) notes.push(`Unlocked ${got.join(' & ')}!`);
  winNote = notes.join('   ');
  const camX = player.x - PLAYER_SCREEN_X;
  for (const side of [-1, 1]) {
    for (let i = 0; i < 45; i++) {
      emit(particles, { x: camX + (side < 0 ? 1 : W / T - 1), y: 0.3, vx: -side * (3 + Math.random() * 7), vy: 12 + Math.random() * 9, g: -22,
        life: 1.6 + Math.random() * 0.6, size: 7, spin: (Math.random() - 0.5) * 16, color: `hsl(${Math.random() * 360},90%,60%)` });
    }
  }
}

function die() {
  const pct = progress();
  save.best[selected] = Math.max(save.best[selected] || 0, pct);
  save.deaths++; persist();
  if (save.deaths >= 50) unlockSecret('deaths');
  if (pct >= 90) unlockSecret('close');
  deathEffect(particles, player.x + 0.5, player.y + 0.5, skin('death').name, mainColor(skin(player.mode)));
  if (!REDUCED_MOTION && save.settings.shake) shake = 0.35;
  song = null; sfx('death');
}

// ---- Color and shape helpers ----
const solid = c => c.slice(0, 7);

}

const bodyColor = s => s.body === 'glitch' ? GLITCH[Math.floor(performance.now() / 90) % GLITCH.length] : s.body;

const FACE = { Easy: '#3ddc4a', Normal: '#2fa4ff', Hard: '#ff8a1f', Insane: '#d63cff', Demon: '#e8212b' };

// ---- Icons ----
// Cube patterns, drawn in a 40x40 box centred on 0,0.
const LOOKS = {

  face(body, inner) {

  },
  crown(body, inner) {

function traceCustomCube(look, h, t) {

  if (look === 'prism') {
    ctx.moveTo(0, -h); ctx.lineTo(h, -h * 0.48); ctx.lineTo(h * 0.76, h * 0.55); ctx.lineTo(0, h); ctx.lineTo(-h * 0.76, h * 0.55); ctx.lineTo(-h, -h * 0.48);
  } else if (look === 'jelly') {
    const wobble = Math.sin(t * 9) * 2;
    ctx.moveTo(-h * 0.72, h * 0.75); ctx.quadraticCurveTo(-h - wobble, 0, -h * 0.5, -h * 0.78);
    ctx.quadraticCurveTo(0, -h - wobble, h * 0.68, -h * 0.72); ctx.quadraticCurveTo(h + wobble, 0, h * 0.72, h * 0.72);
    ctx.quadraticCurveTo(0, h + wobble, -h * 0.72, h * 0.75);
  } else if (look === 'orbit') {
    ctx.moveTo(0, -h); ctx.lineTo(h * 0.7, -h * 0.7); ctx.lineTo(h, 0); ctx.lineTo(h * 0.7, h * 0.7);
    ctx.lineTo(0, h); ctx.lineTo(-h * 0.7, h * 0.7); ctx.lineTo(-h, 0); ctx.lineTo(-h * 0.7, -h * 0.7);
  } else if (look === 'aegis') {
    ctx.moveTo(0, -h); ctx.lineTo(h * 0.84, -h * 0.68); ctx.lineTo(h * 0.76, h * 0.16);
    ctx.quadraticCurveTo(h * 0.53, h * 0.72, 0, h); ctx.quadraticCurveTo(-h * 0.53, h * 0.72, -h * 0.76, h * 0.16);
    ctx.lineTo(-h * 0.84, -h * 0.68);
  } else if (look === 'bloom') {
    ctx.moveTo(0, -h * 0.9); ctx.bezierCurveTo(h * 0.22, -h * 1.08, h * 0.48, -h * 0.9, h * 0.5, -h * 0.62);
    ctx.bezierCurveTo(h * 1.02, -h * 0.82, h * 1.08, -h * 0.35, h * 0.72, -h * 0.13);
    ctx.bezierCurveTo(h * 1.08, h * 0.18, h * 0.93, h * 0.65, h * 0.52, h * 0.55);
    ctx.bezierCurveTo(h * 0.42, h * 1.05, -h * 0.04, h * 1.08, -h * 0.2, h * 0.68);
    ctx.bezierCurveTo(-h * 0.65, h * 1.02, -h * 1.02, h * 0.65, -h * 0.68, h * 0.34);
    ctx.bezierCurveTo(-h * 1.05, h * 0.08, -h * 0.92, -h * 0.36, -h * 0.54, -h * 0.46);
    ctx.bezierCurveTo(-h * 0.57, -h * 0.92, -h * 0.18, -h * 1.06, 0, -h * 0.9);
  } else if (look === 'nova') {
    for (let i = 0; i < 16; i++) {
      const a = -Math.PI / 2 + i * TAU / 16, r = h * (i % 2 ? 0.55 : (i % 4 === 0 ? 1 : 0.82));
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);

      const x = Math.cos(a) * r, y = Math.sin(a) * r;

    ctx.moveTo(-h * 0.7, h * 0.8); ctx.lineTo(-h, -h * 0.2); ctx.lineTo(-h * 0.2, -h);
    ctx.lineTo(h * 0.85, -h * 0.75); ctx.lineTo(h * 0.56, -h * 0.1); ctx.lineTo(h, h * 0.55);
    ctx.lineTo(h * 0.15, h * 0.42); ctx.lineTo(-h * 0.35, h);

// Wave darts, pointing right in a 40x40 box. The first shape gets the glow.
const WAVES = {
  dart(body, inner) {

    ctx.shadowBlur = 0;
    poly([[-13, -5], [-21, -12], [-9, -5]], inner, 2); poly([[-13, 5], [-21, 12], [-9, 5]], inner, 2); // fletching
    box(-12, -1.5, 22, 3, inner, 0);
  },
  comet(body, inner, t) {

    ctx.beginPath(); ctx.arc(6, 0, 10, 0, TAU); ctx.fillStyle = vgrad(-10, 10, shade(body, 0.4), body, shade(body, -0.3)); ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(9, -4, 3, 0, TAU); ctx.fill();
  },
  fang(body, inner) {
    const path = () => { ctx.beginPath(); ctx.moveTo(-15, -11); ctx.quadraticCurveTo(9, -11, 18, 5); ctx.quadraticCurveTo(3, 1, -15, 11); ctx.quadraticCurveTo(-9, 0, -15, -11); };

    ctx.save(); ctx.clip(); ctx.fillStyle = inner; ctx.beginPath(); ctx.arc(19, 6, 9, 0, TAU); ctx.fill(); ctx.restore(); // a bloody tip
    path(); ctx.lineJoin = 'round'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();

  kite(body, inner, t) {

    ctx.shadowBlur = 0;
    poly([[17, 0], [0, -12], [0, 0]], alpha(solid(inner), 0.5), 0); poly([[-15, 0], [0, 12], [0, 0]], alpha(solid(inner), 0.5), 0);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(17, 0); ctx.lineTo(-15, 0); ctx.moveTo(0, -12); ctx.lineTo(0, 12); ctx.stroke();

  blade(body, inner) {

    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-4, -1.5); ctx.lineTo(14, -1.5); ctx.stroke();

  crystal(body, inner, t) {

function drawSpirit(x, y, s, color) { // a little ghost, about s pixels tall
  const r = s * 0.38;
  ctx.beginPath(); ctx.arc(x, y - s * 0.12, r, Math.PI, 0);
  for (let i = 0; i <= 4; i++) ctx.lineTo(x + r - i * r / 2, y + s * (i % 2 ? 0.26 : 0.38));

  ctx.fillStyle = '#000';
  for (const k of [-1, 1]) { ctx.beginPath(); ctx.ellipse(x + k * r * 0.4, y - s * 0.12, r * 0.15, r * 0.24, 0, 0, TAU); ctx.fill(); }
}

function drawTrailIcon(name, cx, cy) {
  ctx.save(); ctx.translate(cx, cy); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pts = [...Array(9)].map((_, i) => [-20 + i * 5, Math.sin(i * 0.75 + 0.6) * 7]), base = ctx.globalAlpha;
  switch (name) {
    case 'None':
      ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.moveTo(-9, 9); ctx.lineTo(9, -9); ctx.stroke();
      break;
    case 'Streak': case 'Rainbow':
      for (let i = 0; i + 1 < pts.length; i++) {
        ctx.strokeStyle = name === 'Rainbow' ? `hsl(${i * 45},100%,62%)` : `rgba(255,255,255,${0.15 + i * 0.11})`; ctx.lineWidth = 2 + i * 1.2;
        ctx.beginPath(); ctx.moveTo(...pts[i]); ctx.lineTo(...pts[i + 1]); ctx.stroke();
      }
      break;
    case 'Sparkle': for (const [x, y, r] of [[-13, 7, 5], [0, -5, 9], [13, 6, 5.5]]) sparkle(x, y, r, '#fff3a0'); break;
    case 'Fire':
      for (const [k, oy, c] of [[1, 0, '#ff5a1f'], [0.6, 4, '#ffd400']]) {
        ctx.beginPath(); ctx.moveTo(0, -17 * k + oy); ctx.quadraticCurveTo(14 * k, oy, 7 * k, 11 * k + oy);
        ctx.quadraticCurveTo(0, 16 * k + oy, -7 * k, 11 * k + oy); ctx.quadraticCurveTo(-14 * k, oy, 0, -17 * k + oy);
        ctx.fillStyle = c; ctx.fill();
        if (k === 1) { ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke(); }
      }
      break;
    case 'Bubbles':
      for (const [x, y, r] of [[-11, 7, 6], [3, -4, 8.5], [14, 9, 4.5]]) {
        ctx.strokeStyle = 'rgba(170,230,255,0.95)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(x - r * 0.5, y - r * 0.5, 2.5, 2.5);
      }
      break;
    case 'Pixels': for (const [x, y, c] of [[-15, 5, '#ffd400'], [-8, -5, '#fff'], [-1, 7, '#ffd400'], [5, -3, '#fff'], [11, 8, '#ffd400'], [15, -10, '#fff']]) box(x - 3, y - 3, 6, 6, c, 1.5); break;
    case 'Echo': [0.25, 0.5, 1].forEach((a, i) => { ctx.globalAlpha = base * a; box(-18 + i * 9, -7, 14, 14, '#ffd400', 2); }); break;
    case 'Stardust': for (const [x, y] of [[-14, 8], [-4, -9], [8, 4], [16, -10]]) sparkle(x, y, 4.5, '#fff2a8'); break;
    case 'Emberline':
      ctx.strokeStyle = '#ff9a42'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-20, 4); ctx.bezierCurveTo(-10, -12, 4, 14, 20, -4); ctx.stroke();
      for (const [x, y] of [[-12, -4], [0, 5], [12, -1]]) sparkle(x, y, 3, '#fff1a0'); break;

      for (let i = 0; i < 7; i++) {

        poly([[x, y - 6], [x + 4, y], [x, y + 6], [x - 4, y]], `hsl(${i * 48},100%,68%)`, 0);
      }
      break;
  }
  ctx.restore();
}

function drawDeathIcon(name, cx, cy) {

function drawFace(cx, cy, r, d) { // difficulty face
  const c = FACE[d], horns = d === 'Insane' || d === 'Demon', big = d === 'Demon' ? 1.2 : 1;
  ctx.save(); ctx.lineCap = 'round';
  if (horns) for (const s of [-1, 1]) poly([[cx + s * r * 0.4, cy - r * 0.75], [cx + s * r * 0.85 * big, cy - r * 1.3 * big], [cx + s * r * 0.85, cy - r * 0.45]], shade(c, -0.35), 2);

  g.addColorStop(0, shade(c, 0.45)); g.addColorStop(1, c);

  ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.stroke();

  else if (d === 'Normal') { ctx.moveTo(cx - r * 0.3, cy + r * 0.38); ctx.quadraticCurveTo(cx, cy + r * 0.52, cx + r * 0.3, cy + r * 0.38); }
  else if (d === 'Hard') ctx.arc(cx, cy + r * 0.78, r * 0.38, 1.2 * Math.PI, 1.8 * Math.PI);
  else if (d === 'Insane') [-0.36, -0.18, 0, 0.18, 0.36].forEach((k, i) => ctx.lineTo(cx + k * r, cy + r * (i % 2 ? 0.3 : 0.45)));
  else { // Demon: an open grin with fangs
    ctx.moveTo(cx - r * 0.45, cy + r * 0.28); ctx.quadraticCurveTo(cx, cy + r * 0.85, cx + r * 0.45, cy + r * 0.28); ctx.closePath();
    ctx.fillStyle = '#2a0000'; ctx.fill();
  }
  ctx.stroke();
  if (d === 'Demon') for (const s of [-1, 1]) poly([[cx + s * r * 0.3, cy + r * 0.31], [cx + s * r * 0.2, cy + r * 0.52], [cx + s * r * 0.1, cy + r * 0.34]], '#fff', 1.5);

}

function drawLock(cx, cy) {

// ---- World ----
const fillScreen = () => ctx.fillRect(-VIEW.x, -VIEW.y, W + 2 * VIEW.x, H + 2 * VIEW.y);
function edge() { // white line that fades out at both ends of the screen, like GD's ground line
  const g = ctx.createLinearGradient(-VIEW.x, 0, W + VIEW.x, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.2, '#fff'); g.addColorStop(0.8, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)');
  return g;
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, (H / 2 + VIEW.y) * 0.8, W / 2, H / 2, (W / 2 + VIEW.x) * 1.24);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.42)');
  return g;
}

function drawBackground(hue, camX, time) {
  const L = -VIEW.x, R = W + VIEW.x, top = -VIEW.y;
  ctx.fillStyle = vgrad(0, GROUND, `hsl(${hue},75%,36%)`, `hsl(${hue},70%,17%)`);
  fillScreen();

  ctx.lineWidth = 2; ctx.fillStyle = `hsla(${hue},90%,70%,0.05)`; ctx.strokeStyle = `hsla(${hue},90%,80%,0.08)`;
  for (let x = L - mod(camX * T * 0.08 + L, S); x < R; x += S) {
    for (let y = top - mod(top + 40, S); y < GROUND; y += S) { rr(x + 10, y + 10, S - 20, S - 20, 14); ctx.fill(); ctx.stroke(); }
  }
  for (let i = 0; i < 9; i++) { // near layer: drifting squares
    const s = 26 + (i * 23) % 50, px = mod(i * 237 - camX * T * 0.3, R - L + 200) + L - 100, py = 40 + (i * 89) % (GROUND - 140);
    ctx.save(); ctx.translate(px, py); ctx.rotate(time * 0.25 * (i % 2 ? 1 : -1) + i);
    ctx.fillStyle = `hsla(${hue},90%,75%,0.08)`; ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.strokeStyle = `hsla(${hue},90%,85%,0.14)`; ctx.strokeRect(-s / 2, -s / 2, s, s);
    ctx.restore();
  }
  const P = 150, off = camX * T * 0.2; // a range of dark peaks along the horizon
  ctx.fillStyle = `hsla(${hue},70%,8%,0.4)`; ctx.strokeStyle = `hsla(${hue},90%,75%,0.16)`; ctx.lineJoin = 'round';
  for (let k = Math.floor((off + L) / P) - 2; k * P - off < R + 2 * P; k++) {
    const x = k * P - off, h = 60 + mod(k * 137, 5) * 26, w = 90 + mod(k * 71, 3) * 35;
    ctx.beginPath(); ctx.moveTo(x - w, GROUND); ctx.lineTo(x, GROUND - h); ctx.lineTo(x + w, GROUND); ctx.fill(); ctx.stroke();

    ctx.fillStyle = `hsla(${hue},100%,85%,${0.15 + (i % 4) * 0.08})`; ctx.fillRect(x, y, s, s);
  }

}

function drawFloor(hue, camX, lineY, up) { // ground, or the ceiling in ship mode when up is true
  const L = -VIEW.x, R = W + VIEW.x, y0 = up ? -VIEW.y : lineY, h = up ? lineY + VIEW.y : H + VIEW.y - lineY;
  if (h <= 0) return;
  ctx.fillStyle = vgrad(lineY, up ? lineY - 80 : lineY + 80, `hsl(${hue},70%,22%)`, `hsl(${hue},70%,8%)`);
  ctx.fillRect(L, y0, R - L, h);
  ctx.strokeStyle = `hsla(${hue},90%,75%,0.16)`; ctx.lineWidth = 2;

function drawBlocks(blocks, sx, sy, hue) {
  if (!blocks.length) return;
  const fill = vgrad(0, T, `hsl(${hue},45%,17%)`, `hsl(${hue},60%,5%)`);
  const glow = Object.entries({ top: [0, 0, 0, 1], bottom: [0, T, 0, T - 1], left: [0, 0, 1, 0], right: [T, 0, T - 1, 0] }).map(([side, [x0, y0, x1, y1]]) => {
    const g = ctx.createLinearGradient(x0, y0, x0 + (x1 - x0) * 14, y0 + (y1 - y0) * 14); // inner neon glow along exposed edges
    g.addColorStop(0, `hsla(${hue},100%,72%,0.3)`); g.addColorStop(1, `hsla(${hue},100%,72%,0)`);
    return [side, g];
  });
  ctx.lineWidth = 2; ctx.strokeStyle = `hsla(${hue},80%,80%,0.13)`;
  for (const t of blocks) {
    const x = sx(t.x), y = sy(t.y + 1);

    ctx.fillStyle = fill; ctx.fillRect(0, 0, T, T);
    for (const [side, g] of glow) if (t.open[side]) { ctx.fillStyle = g; ctx.fillRect(0, 0, T, T); }

    ctx.translate(-x, -y);

  ctx.beginPath(); // outline only exposed edges: a wide glow pass, then a crisp white pass
  for (const t of blocks) {
    const x = sx(t.x), y = sy(t.y + 1), o = t.open;
    if (o.top) { ctx.moveTo(x, y); ctx.lineTo(x + T, y); }
    if (o.bottom) { ctx.moveTo(x, y + T); ctx.lineTo(x + T, y + T); }
    if (o.left) { ctx.moveTo(x, y); ctx.lineTo(x, y + T); }
    if (o.right) { ctx.moveTo(x + T, y); ctx.lineTo(x + T, y + T); }
  }
  ctx.lineCap = 'square';
  ctx.strokeStyle = `hsla(${hue},100%,75%,0.35)`; ctx.lineWidth = 7; ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.lineCap = 'butt';
}

const SPIKE_SPRITES = new Map();
const CHAIN_LINK_SPRITES = new Map();
const hueBucket = hue => Math.round(hue / 5) * 5;

function spikeSprite(hue, down) {
  const bucket = hueBucket(hue), key = `${bucket}:${down ? 1 : 0}`;
  if (SPIKE_SPRITES.has(key)) return SPIKE_SPRITES.get(key);
  const sprite = document.createElement('canvas');
  sprite.width = T; sprite.height = T;
  const c = sprite.getContext('2d');
  if (down) { c.translate(0, T); c.scale(1, -1); }
  c.beginPath(); c.moveTo(3, T); c.lineTo(T / 2, 3); c.lineTo(T - 3, T); c.closePath();
  const fill = c.createLinearGradient(0, 0, 0, T);
  fill.addColorStop(0, `hsl(${bucket},45%,22%)`); fill.addColorStop(1, '#050508');
  c.fillStyle = fill; c.fill(); c.lineJoin = 'round';
  c.strokeStyle = `hsla(${bucket},100%,75%,0.35)`; c.lineWidth = 6; c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.stroke();
  c.beginPath(); c.moveTo(11, T - 4); c.lineTo(T / 2, 14); c.lineTo(T - 11, T - 4);
  c.strokeStyle = 'rgba(255,255,255,0.2)'; c.lineWidth = 1.5; c.stroke();
  SPIKE_SPRITES.set(key, sprite); return sprite;
}

function chainLinkSprite(hue, sideways) {
  const bucket = hueBucket(hue), key = `${bucket}:${sideways ? 1 : 0}`;
  if (CHAIN_LINK_SPRITES.has(key)) return CHAIN_LINK_SPRITES.get(key);
  const sprite = document.createElement('canvas'); sprite.width = 16; sprite.height = 16;
  const c = sprite.getContext('2d'), cx = 8, cy = 8;
  const rx = sideways ? 5.2 : 4.1, ry = sideways ? 3.8 : 6.2;
  c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, TAU); c.fillStyle = '#201a30'; c.fill();
  c.strokeStyle = '#090812'; c.lineWidth = 4.5; c.stroke();
  c.strokeStyle = `hsl(${bucket},58%,61%)`; c.lineWidth = 2.5; c.stroke();
  c.beginPath(); c.ellipse(cx - 0.8, cy - 0.9, rx * 0.56, ry * 0.58, 0, Math.PI * 1.12, Math.PI * 1.82);
  c.strokeStyle = 'rgba(255,255,255,0.48)'; c.lineWidth = 1.2; c.stroke();
  CHAIN_LINK_SPRITES.set(key, sprite); return sprite;
}

function drawSpike(x, y, down, hue, fill) {
  ctx.drawImage(spikeSprite(hue, down), x, y);
}

function drawChain(cx, y1, y2, hue) {
  if (y2 <= y1) return;
  for (let i = 0, y = y1 + 6; y < y2 - 4; i++, y += 9.5) {
    ctx.drawImage(chainLinkSprite(hue, i % 2 === 1), cx - 8, y - 8);
  }

function drawHangingBar(x, y, ceilingY, hue) {
  for (const cx of [x + 7, x + T - 7]) drawChain(cx, ceilingY, y + 5, hue);

  ctx.fillStyle = `hsla(${hue},100%,82%,0.9)`; ctx.fillRect(x + 3, y + 6, T - 6, 2);
  ctx.strokeStyle = `hsla(${hue},100%,88%,0.55)`; ctx.lineWidth = 1;

    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

function drawFallingSpike(x, y, ceilingY, hue) {

function drawGiantSpike(x, y, hue) {

function beatPulse(time) {
  const def = song?.def || SONGS[selected % SONGS.length] || MENU_SONG;
  const elapsed = AC?.state === 'running' && state !== 'pause' && save.settings.music > 0 && song?.def
    ? Math.max(0, AC.currentTime - song.start)
    : time;
  const phase = mod(elapsed / (60 / def.bpm), 1), distance = Math.min(phase, 1 - phase);
  return Math.max(0, 1 - distance / 0.22) ** 2;
}

  const bob = pulse * 1.8, radius = 6 + pulse * 2.3, dotY = top - bob;

  for (let py = dotY + radius + 7; py < base - 5; py += 10) {

    ctx.beginPath(); ctx.moveTo(cx - 3, py); ctx.lineTo(cx + 3, py); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 2, py); ctx.lineTo(cx + 2, py); ctx.stroke();
  }
  rr(cx - 9, base - 5, 18, 7, 3); ctx.fillStyle = '#171323'; ctx.fill();
  rr(cx - 6, base - 4, 12, 3, 2); ctx.fillStyle = `hsl(${hue},82%,70%)`; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, dotY, radius + 4 + pulse * 2, 0, TAU);
  ctx.fillStyle = `hsla(${hue},100%,72%,${0.12 + pulse * 0.2})`; ctx.fill();
  if (pulse > 0.12) {
    ctx.beginPath(); ctx.arc(cx, dotY, radius + 5 + pulse * 5, 0, TAU);
    ctx.strokeStyle = `hsla(${hue},100%,86%,${pulse * 0.55})`; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, dotY, radius + 1.5, 0, TAU); ctx.fillStyle = '#171323'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, dotY, radius, 0, TAU); ctx.fillStyle = `hsl(${hue},100%,66%)`; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx - radius * 0.28, dotY - radius * 0.28, 1.8, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.restore();
}

function drawPad(x, y, time, red = false) {
  const cx = x + T / 2, base = y + T;
  for (let i = 0; i < 3; i++) { // sparks rising off the pad
    const k = mod(time * 1.4 + i / 3, 1);
    ctx.fillStyle = red ? `rgba(255,90,75,${(1 - k) * 0.85})` : `rgba(255,220,60,${(1 - k) * 0.8})`;
    ctx.fillRect(cx - 14 + i * 12, base - 8 - k * 34, 4, 4);
  }
  ctx.save();
  const accent = red ? '#ff4545' : '#ffd400';
  ctx.shadowColor = accent; ctx.shadowBlur = red ? 17 : 14;
  ctx.fillStyle = red ? vgrad(base - 11, base, '#ffd1ca', '#ff4545', '#9f1328') : vgrad(base - 11, base, '#fff6a8', '#ffd400', '#ff9d00');
  ctx.beginPath(); ctx.ellipse(cx, base - 1, T * 0.42, 10, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, base - 2, T * 0.25, 4, 0, Math.PI, 0); ctx.strokeStyle = red ? 'rgba(255,235,235,0.85)' : 'rgba(255,255,220,0.8)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function drawOrb(x, y, used, time, boost = false) {
  const cx = x + T / 2, cy = y + T / 2;
  const color = boost ? '#45edff' : '#ffd400', mid = boost ? '#72f5ff' : '#ffd400', dark = boost ? '#008da8' : '#ff8f00';
  ctx.save();
  if (!used) {
    const k = mod(time * 1.2, 1);
    ctx.strokeStyle = boost ? `rgba(69,237,255,${0.7 * (1 - k)})` : `rgba(255,212,0,${0.7 * (1 - k)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, T * (0.36 + k * 0.3), 0, TAU); ctx.stroke();
    ctx.shadowColor = color; ctx.shadowBlur = 18;
  } else ctx.globalAlpha = 0.35;
  const g = ctx.createRadialGradient(cx - 4, cy - 5, 1, cx, cy, T * 0.33);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, mid); g.addColorStop(1, dark);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, T * 0.32, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.stroke();
  if (boost) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(time * 0.8); ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0, -T * 0.17); ctx.lineTo(T * 0.17, 0); ctx.lineTo(0, T * 0.17); ctx.lineTo(-T * 0.17, 0); ctx.closePath(); ctx.stroke(); ctx.restore();
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, T * 0.17, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawCoin(x, y, banked, time) {
  const cx = x + T / 2, cy = y + T / 2 + Math.sin(time * 3) * 3, spin = Math.max(0.12, Math.abs(Math.cos(time * 2.2)));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(spin, 1);
  ctx.shadowColor = banked ? '#a9b6e8' : '#ffcc33'; ctx.shadowBlur = 16;
  drawCoinIcon(0, 0, T * 0.38, banked ? 'old' : 'new');
  ctx.shadowBlur = 0;
  drawStar(0, 1, T * 0.15, banked ? '#d7defa' : '#ffe680');
  ctx.restore();
  const tw = mod(time * 0.8, 1);
  if (tw < 0.3) sparkle(cx + 11, cy - 13, Math.sin(tw / 0.3 * Math.PI) * 7);
}

// Portals draw in two halves so the player appears to pass through them: the back half (glow, swirling
// membrane, fins, left arc) before the player, then the front arc and the end caps over it.
function drawPortal(t, x, y, front, time) {
  const color = MODE_COLOR[PORTAL_MODE[t.type]], h = t.tall * T, cx = x + T / 2, cy = y + h / 2, rx = T * 0.6, ry = h / 2 - 4;
  const ellipse = (ax, ay, a0 = 0, a1 = TAU) => { ctx.beginPath(); ctx.ellipse(cx, cy, ax, ay, 0, a0, a1); };
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (!front) {
    ctx.globalCompositeOperation = 'lighter';
    const top = GROUND - ROWS * T; // a faint beam through the whole column, since a portal works at any height
    ctx.save(); ctx.translate(cx, (top + GROUND) / 2); ctx.scale(1, (GROUND - top) / T);
    const beam = ctx.createRadialGradient(0, 0, 0, 0, 0, T / 2);
    beam.addColorStop(0, alpha(color, 0.16)); beam.addColorStop(0.6, alpha(color, 0.08)); beam.addColorStop(1, alpha(color, 0));
    ctx.fillStyle = beam; ctx.fillRect(-T / 2, -T / 2, T, T);
    ctx.restore();
    ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry / rx); // soft halo
    const halo = ctx.createRadialGradient(0, 0, rx * 0.3, 0, 0, rx * 1.7);
    halo.addColorStop(0, alpha(color, 0.3)); halo.addColorStop(1, alpha(color, 0));
    ctx.fillStyle = halo; ctx.fillRect(-rx * 1.7, -rx * 1.7, rx * 3.4, rx * 3.4);
    ctx.restore();
    ellipse(rx - 3, ry - 3); ctx.save(); ctx.clip(); // the membrane: brighter towards the rim, with ripples flowing inward
    const fill = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
    fill.addColorStop(0, alpha(color, 0.45)); fill.addColorStop(0.5, alpha(color, 0.08)); fill.addColorStop(1, alpha(color, 0.3));
    ctx.fillStyle = fill; ctx.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
    for (let i = 0; i < 3; i++) {
      const k = mod(time * 0.7 + i / 3, 1);
      ctx.strokeStyle = alpha(color, 0.8 * Math.sin(k * Math.PI)); ctx.lineWidth = 2.5;
      ellipse((rx - 3) * (1 - k), (ry - 3) * (1 - k)); ctx.stroke();
    }
    for (let i = 0; i < 2; i++) { // energy streaks racing around the inside of the rim
      const a = time * 2.6 + i * Math.PI;
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2;
      ellipse(rx * 0.72, ry * 0.88, a, a + 1.1); ctx.stroke();
    }
    ctx.restore();
    for (let i = 0; i < 14; i++) { // sparks being pulled in
      const k = mod(time * 0.8 + i / 14, 1), a = i * 2.4 + time * 0.5, r = 1.7 - k * 1.5, s = 1.5 + k * 3;
      ctx.fillStyle = alpha(i % 3 ? color : '#ffffff', Math.min(1, k * 1.6) * 0.9);
      ctx.fillRect(cx + Math.cos(a) * rx * r * 1.4 - s / 2, cy + Math.sin(a) * ry * Math.min(1, r) - s / 2, s, s);
    }
    ctx.globalCompositeOperation = 'source-over';
    for (const k of [-0.6, 0, 0.6]) { // fins on the back of the frame
      const a = Math.PI + k, bx = cx + Math.cos(a) * rx, by = cy + Math.sin(a) * ry, len = k ? 19 : 27, tilt = Math.sign(Math.sin(a)) * 6;
      poly([[bx + 4, by - 11], [bx - len, by + tilt], [bx + 4, by + 11]], vgrad(by - 11, by + 11, shade(color, 0.2), shade(color, -0.45)), 2.5);
      poly([[bx - 2, by - 4], [bx - len * 0.6, by + tilt * 0.6], [bx - 2, by + 3]], 'rgba(255,255,255,0.45)', 0);
    }
  }
  // The frame: glow and black outline, a shaded band, a bright stripe and an inner highlight.
  const a0 = front ? -Math.PI / 2 : Math.PI / 2, a1 = front ? Math.PI / 2 : Math.PI * 1.5;
  ellipse(rx, ry, a0, a1);
  ctx.shadowColor = color; ctx.shadowBlur = 18; ctx.strokeStyle = '#000'; ctx.lineWidth = 14; ctx.stroke();
  ctx.shadowBlur = 0; ctx.strokeStyle = vgrad(cy - ry, cy + ry, shade(color, 0.45), color, shade(color, -0.4)); ctx.lineWidth = 9; ctx.stroke();
  ellipse(rx + 1.5, ry + 1.5, a0, a1); ctx.strokeStyle = alpha(color, 0.9); ctx.lineWidth = 2.5; ctx.stroke();
  ellipse(rx - 2.5, ry - 2.5, a0, a1); ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2; ctx.stroke();
  if (front) for (const s of [-1, 1]) { // gem caps hide the seams where the halves meet
    const gy = cy + s * ry;
    poly([[cx, gy - 9], [cx + 8, gy], [cx, gy + 9], [cx - 8, gy]], vgrad(gy - 9, gy + 9, shade(color, 0.6), color, shade(color, -0.35)), 2.5);
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(cx - 1.5, gy - 4.5, 3, 3);
  }
  ctx.restore();
}

function drawFinish(fx) {
  if (fx > W + VIEW.x + 20 || fx < -VIEW.x - 100) return;
  const g = ctx.createLinearGradient(fx - 90, 0, fx, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,0.3)');
  ctx.fillStyle = g; ctx.fillRect(fx - 90, -VIEW.y, 90, GROUND + VIEW.y);
  for (let y = GROUND - 10 * Math.ceil((GROUND + VIEW.y) / 10), i = 0; y < GROUND; y += 10, i++) {
    ctx.fillStyle = i % 2 ? '#111' : '#fff'; ctx.fillRect(fx, y, 6, 10);
    ctx.fillStyle = i % 2 ? '#fff' : '#111'; ctx.fillRect(fx + 6, y, 6, 10);
  }
}

function drawWorld(time) {
  // Physics takes 60 steps a second; drawing the player part way to its next spot keeps motion smooth at any refresh rate.
  const blend = Math.abs(player.x - was.x) < 1 && was.mode === player.mode ? tween : 1; // not across a respawn or a portal
  const me = { ...player, x: was.x + (player.x - was.x) * blend, y: was.y + (player.y - was.y) * blend, rot: was.rot + (visRot - was.rot) * blend };
  const camX = me.x - PLAYER_SCREEN_X;
  const sx = x => (x - camX) * T, sy = y => GROUND - y * T;
  const hue = level.hue + Math.sin(me.x / 15) * 20;
  const worldParticles = () => drawParticles(particles, q => sx(q.x), q => sy(q.y));
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 36, (Math.random() - 0.5) * shake * 36);
  drawBackground(hue, camX, time);
  drawFloor(hue, camX, GROUND, false);
  if (ceilAnim > 0.01) drawFloor(hue, camX, sy(ROWS) - (1 - ceilAnim) * (100 + VIEW.y), true);
  ctx.globalAlpha = 0.9; txt(`Attempt ${attempts}`, sx(2.5), sy(5), 46, '#fff', 'left', 8); ctx.globalAlpha = 1;
  if (attempts === 1) ui('Hold Space, ↑ or click to jump · Esc to pause', sx(2.6), sy(4.2), 16, 'rgba(255,255,255,0.85)', 'left');
  drawFinish(sx(level.len));

  const vis = [];
  const fromTile = Math.max(0, Math.floor(camX - 3 - VIEW.x / T));
  const toTile = Math.min(level.len, Math.ceil(camX + (W + VIEW.x) / T + 1));
  for (let x = fromTile; x < toTile; x++) vis.push(...(level.columns?.get(x) || []));
  vis.sort((a, b) => a.id - b.id);
  drawBlocks(vis.filter(t => t.type === '#'), sx, sy, hue);
  const spikeFill = vgrad(0, T, `hsl(${hue},45%,22%)`, '#050508');
  const portals = [];
  for (const t of vis) {
    const x = sx(t.x), y = sy(t.y + 1);
    switch (t.type) {
      case '^': drawSpike(x, y, false, hue, spikeFill); break;
      case 'v':
        if (t.chainTop) drawChain(x + T / 2, sy(ROWS), y + 3, hue);
        drawSpike(x, y, true, hue, spikeFill); break;
      case 'h': drawHangingBar(x, y, sy(ROWS), hue); break;
      case 'F': drawFallingSpike(x, sy(fallingSpikeY(t, me.x) + 1), sy(ROWS), hue); break;
      case 'G': drawGiantSpike(x, y, hue); break;
      case 's': drawSaw(x, y, time, hue); break;
      case 'i': drawSignalPole(x, y, time, hue); break;
      case 'p': case 'r': drawPad(x, y, time, t.type === 'r'); break;
      case 'o': case 'b': drawOrb(x, y, player.used.includes(t.id), time, t.type === 'b'); break;
      case 'c': if (!player.coins.includes(t.id)) drawCoin(x, y, (save.coins[selected] || []).includes(t.id), time); break;
      case 'S': case 'C': case 'B': case 'W': if (t.tall) { drawPortal(t, x, y, false, time); portals.push([t, x, y]); } break;
    }
  }
  if (state !== 'dead') {
    const cx = q => sx(q.x) + T / 2, cy = q => sy(q.y) - T / 2, trail = [...history.slice(0, -1), me];
    drawTrail(trail, skin('trail').name, cx, cy, 1, time, (q, x, y) => ICON[q.mode](x, y, q.rot, skin(q.mode), T));
    if (me.mode === 'wave') drawWaveTrail(trail, cx, cy, mainColor(skin('wave')));
    if (me.mode === 'ship' && state === 'play') drawFlame(cx(me), cy(me), me.rot, holding, skin('ship').look);
    ICON[me.mode](cx(me), cy(me), me.rot, skin(me.mode), T);
  }
  for (const [t, x, y] of portals) drawPortal(t, x, y, true, time);
  if (state !== 'win') worldParticles();
  ctx.restore();

  ctx.fillStyle = vignette(); fillScreen();
  if (state === 'dead') {
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, 0.35 - stateTime) * (REDUCED_MOTION ? 0.3 : 1)})`;
    fillScreen();
  }
  drawHUD();
  if (state === 'win') { drawWinPanel(); worldParticles(); }
}

function drawHUD() {
  const pct = progress(), bx = W / 2 - 150, by = 14 - VIEW.y;
  if (save.settings.progress) {
    rr(bx, by, 300, 14, 7); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();
    if (pct > 0) { rr(bx + 2, by + 2, Math.max(10, 296 * pct / 100), 10, 5); ctx.fillStyle = vgrad(by, by + 14, '#c3ff7a', '#3fcf2a'); ctx.fill(); }
    txt(`${pct}%`, bx + 345, by + 15, 22, '#fff', 'center', 5);
  }
  txt(level.name, 16 - VIEW.x, 32 - VIEW.y, 22, '#fff', 'left', 5);
  const banked = save.coins[selected] || [];
  level.coinTiles.forEach((c, i) => drawCoinIcon(W + VIEW.x - 80 - i * 28, 24 - VIEW.y, 10, player.coins.includes(c.id) ? 'new' : banked.includes(c.id) ? 'old' : 'none'));
  if (state === 'play' || state === 'dead') {
    const b = pauseBtn();
    rr(b.x, b.y, b.w, b.h, 10); ctx.fillStyle = hovered(b) ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.35)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(b.x + 14, b.y + 11, 5, 18); ctx.fillRect(b.x + 25, b.y + 11, 5, 18);
  }
}

function drawWinPanel() {
  const a = Math.min(1, stateTime * 3);
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; fillScreen();
  const pw = 500, ph = 240, px = W / 2 - pw / 2, py = H / 2 - ph / 2 + (1 - a) * 40;
  rr(px, py, pw, ph, 20); ctx.fillStyle = vgrad(py, py + ph, 'rgba(44,38,90,0.96)', 'rgba(16,14,34,0.96)'); ctx.fill();
  ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 3; ctx.stroke();
  txt('LEVEL COMPLETE!', W / 2, py + 64, 46, vgrad(py + 28, py + 64, '#fff7b0', '#ffd400', '#ff7a00'), 'center', 8);
  ui(`${level.name} · ${attempts} attempt${attempts > 1 ? 's' : ''}`, W / 2, py + 100, 16, 'rgba(255,255,255,0.85)');
  const got = save.coins[selected] || [];
  level.coinTiles.forEach((c, i) => drawCoinIcon(W / 2 - (level.coinTiles.length - 1) * 18 + i * 36, py + 134, 13, got.includes(c.id) ? 'new' : 'none'));
  ctx.font = `26px ${FONT}`; // shrink a long note (several unlocks) to fit the panel
  if (winNote) txt(winNote, W / 2, py + 186, Math.min(26, 26 * (pw - 40) / ctx.measureText(winNote).width), '#ffd400', 'center', 5);
  ctx.globalAlpha = a * (0.6 + 0.4 * Math.sin(stateTime * 5));
  ui('Press jump to continue', W / 2, py + ph - 16, 14, '#fff');
  ctx.restore();
}

const cardRect = i => ({ x: W / 2 - CARD_W / 2 + (i - menuScroll) * CARD_STEP, y: CARD_Y, w: CARD_W, h: CARD_H });
const PREV_BTN = { x: W / 2 - CARD_W / 2 - 76, y: CARD_Y + 86, w: 48, h: 60 }, NEXT_BTN = { x: W / 2 + CARD_W / 2 + 28, y: CARD_Y + 86, w: 48, h: 60 };
const PLAY_BTN = { x: W / 2 - 80, y: 150, w: 160, h: 160 }, SHOP_BTN = { x: W / 2 - 256, y: 170, w: 120, h: 120 }, GEAR_BTN = { x: W / 2 + 136, y: 170, w: 120, h: 120 };
const BACK_BTN = { x: 16, y: 12, w: 104, h: 36 };
const TITLE_BOX = { x: W / 2 - 260, y: 38, w: 520, h: 80 };
const PAUSE_BTNS = [['restart', W / 2 - 130, 32], ['resume', W / 2, 44], ['levels', W / 2 + 130, 32]].map(([id, x, r]) => ({ id, x: x - r, y: 184 - r, w: 2 * r, h: 2 * r }));
const pauseBtn = () => ({ x: W + VIEW.x - 52, y: 6 - VIEW.y, w: 44, h: 40 }); // in the screen's top-right corner, like GD
const GRID_X = 77, GRID_W = 806, GAP = 8, COLS = 8, BOX_W = (GRID_W - (COLS - 1) * GAP) / COLS, BOX_H = 94, TAB_W = (GRID_W - 5 * GAP) / 6;
const SHOP_PAGE_SIZE = COLS * 2;
const tabPos = i => ({ x: GRID_X + i * (TAB_W + GAP), y: 60, w: TAB_W, h: 40 });
const boxPos = i => ({ x: GRID_X + (i % COLS) * (BOX_W + GAP), y: 110 + Math.floor(i / COLS) * (BOX_H + GAP), w: BOX_W, h: BOX_H });
const STAGE = { x: GRID_X, y: 316, w: GRID_W, h: 112 };
const SHOP_PREV = { x: W / 2 - 90, y: 434, w: 32, h: 26 }, SHOP_NEXT = { x: W / 2 + 58, y: 434, w: 32, h: 26 };
const inBox = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
function hovered(b) { const h = inBox(b, mouse.x, mouse.y); if (h) cursorHot = true; return h; }

function drawBalance() {
  const x = W - 196, y = 12;
  rr(x, y, 180, 36, 18); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.stroke();

}

function drawRunner(time) { // the equipped cube hopping along the menu floor
  const x = mod(time * 160, W + 2 * VIEW.x + 120) - 60 - VIEW.x, ph = mod(time * 1.25, 1), air = ph < 0.42;
  const jump = air ? Math.sin(ph / 0.42 * Math.PI) : 0, rot = (Math.floor(time * 1.25) + Math.min(1, ph / 0.42)) * Math.PI / 2;
  drawCube(x, GROUND - T / 2 - jump * 70, rot, skin('cube'), T, true);
}

function panel(x, y, w, h) {
  rr(x, y, w, h, 18); ctx.fillStyle = 'rgba(12,10,30,0.75)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2; ctx.stroke();
}
function backButton() {
  const bb = BACK_BTN;
  rr(bb.x, bb.y, bb.w, bb.h, 12); ctx.fillStyle = hovered(bb) ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.4)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.stroke();
  txt('← Back', bb.x + bb.w / 2, bb.y + 25, 19, '#fff', 'center', 4);
}
function drawArrow(b, d) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  rr(b.x, b.y, b.w, b.h, 12); ctx.fillStyle = hovered(b) ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.5)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
  poly([[cx - d * 7, cy - 13], [cx + d * 9, cy], [cx - d * 7, cy + 13]], '#fff', 2.5);
}
function drawGear(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) for (const [da, k] of [[-0.24, 0.72], [-0.14, 1], [0.14, 1], [0.24, 0.72]]) { const a = (i + 0.5) * TAU / 8 + da; ctx.lineTo(cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k); }
  ctx.closePath(); ctx.moveTo(cx + r * 0.3, cy); ctx.arc(cx, cy, r * 0.3, 0, TAU, true);

function drawToast() {

// ---- Hidden developer tools ----

  ['i', 'Pole light'], ['p', 'Jump pad'], ['r', 'Red pad'], ['o', 'Jump orb'],

function devCurrentLevel() { return LEVELS.find(lvl => lvl.name === devLevelSelect.value) || LEVELS[0]; }

function openDevPanel() {

function devSaveLevel() {

function devCrc32(bytes) {
  let crc = 0xffffffff;
  for (const byte of bytes) {

}
function devMakeZip(files) {

function devExportZip() {

  const readme = 'Deometry Gash — custom level pack\n\nOpen index.html in a modern browser to play. Edited layouts are embedded in index.html, so they travel with this ZIP and do not depend on browser storage.\n\nlevel-overrides.json is included as an editable backup. Extract the ZIP before opening index.html.\n';
  const zip = devMakeZip({ 'index.html': html, 'level-overrides.json': JSON.stringify(DEV_OVERRIDES, null, 2), 'README.txt': readme });
  const url = URL.createObjectURL(zip), link = document.createElement('a');

  document.body.appendChild(link); link.click(); link.remove();

devLevelSelect.addEventListener('change', () => { devLoadDraft(); devStatusText('Loaded ' + devCurrentLevel().name + '.'); });
devOffsetInput.addEventListener('change', () => { devOffset = Math.max(0, Number.parseInt(devOffsetInput.value, 10) || 0); devRenderGrid(); });
document.getElementById('devPrev').addEventListener('click', () => { devOffset = Math.max(0, devOffset - DEV_VIEW_COLS); devRenderGrid(); });
document.getElementById('devNext').addEventListener('click', () => { devOffset += DEV_VIEW_COLS; devRenderGrid(); });
document.getElementById('devAddColumn').addEventListener('click', () => {
  if (devRows[0].length >= 2000) return devStatusText('This editor supports up to 2,000 columns per level.');
  devRows = devRows.map(row => row + '.'); devRenderGrid();
  devStatusText('Added a blank column. Save level to keep the change.');
});
document.getElementById('devRemoveColumn').addEventListener('click', () => {
  if (devRows[0].length <= 1) return devStatusText('A level must have at least one column.');
  devRows = devRows.map(row => row.slice(0, -1)); devRenderGrid();

// ---- Loop ----
let last = performance.now(), acc = 0, clock = 0, tween = 1, was = { x: 0, y: 0, rot: 0 };
function frame(now) {
  acc += Math.min(0.25, (now - last) / 1000); last = now;
  while (acc >= DT) {
    acc -= DT; clock += DT;
    if (toast && (toast.t -= DT) <= 0) toast = null;
    menuScroll += (selected - menuScroll) * 0.18;
    if (state === 'pause') continue; // the level stands still behind the pause menu
    stateTime += DT;
    shake = Math.max(0, shake - DT);
    particles = updateParticles(particles);
    ceilAnim += ((player.mode !== 'cube' ? 1 : 0) - ceilAnim) * 0.12;
    was = { x: player.x, y: player.y, rot: visRot, mode: player.mode }; // frames drawn before the next step blend from here
    if (state === 'play') {
      const prev = { grounded: player.grounded, vy: player.vy, mode: player.mode, grav: player.grav, used: player.used.length, coins: player.coins.length };
      const r = step(player, holding, level, jumpPressed);
      jumpPressed = false;
      if (!r) playEffects(prev);
      if (r === 'dead') die();
      if (r === 'win') finishLevel();
      if (r) { state = r; stateTime = 0; }
    } else if (state === 'dead' && stateTime > 0.8) respawn();
    // ease the cube's landing snap instead of popping to the nearest quarter turn
    visRot = player.mode === 'cube' && player.grounded ? visRot + (player.rot - visRot) * 0.35 : player.rot;
    if (state === 'play') { history.push({ x: player.x, y: player.y, mode: player.mode, rot: visRot }); if (history.length > 60) history.shift(); }
    if (state === 'shop') tickStage();
  }
  if (state !== 'pause') tween = acc / DT; // how far the next physics step has come, for drawing in between
  tickMusic();
  ctx.setTransform(VIEW.k, 0, 0, VIEW.k, VIEW.x * VIEW.k, VIEW.y * VIEW.k);
  cursorHot = false;
  const time = clock + acc;
  if (state === 'menu') drawTitle(time);
  else if (state === 'levels') drawLevels(time);
  else if (state === 'shop') drawShop(time);
  else if (state === 'settings') drawSettingsScreen(time);
  else drawWorld(time);
  if (state === 'pause') drawPause();
  drawToast();
  canvas.style.cursor = cursorHot ? 'pointer' : 'default';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- Input ----
function press() {
  if (state === 'menu') go('levels');
  else if (state === 'levels') startLevel(selected);
  else if (state === 'shop') buyOrEquip(KINDS[shopTab], shopPick);
  else if (state === 'win') { if (stateTime > 0.5) go('levels'); }
  else if (state === 'play' || state === 'dead') { holding = true; jumpPressed = true; }
}
function pauseAction(id) {
  if (id === 'resume') { state = 'play'; sfx('click'); }
  else if (id === 'restart') startLevel(selected);
  else go('levels');
}
function shopSelect(tab, i) { shopTab = tab; shopPick = Math.max(0, Math.min(ITEMS[KINDS[tab]].length - 1, i)); stageClock = 0; stageParticles = []; }
function browseShopPage(direction) {
  const kind = KINDS[shopTab], pages = Math.ceil(ITEMS[kind].length / SHOP_PAGE_SIZE), current = Math.floor(shopPick / SHOP_PAGE_SIZE);
  const page = Math.max(0, Math.min(pages - 1, current + direction));
  if (page !== current) { shopSelect(shopTab, page * SHOP_PAGE_SIZE); sfx('click'); }
}
function openShop() { go('shop'); shopSelect(shopTab, shopPick); }
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
addEventListener('keydown', e => {
  audio(); // the first key press is allowed to start the sound
  keys = [...keys, e.code].slice(-KONAMI.length);
  if (keys.join() === KONAMI.join()) { unlockSecret('konami'); devArmed = true; typed = ''; }
  if (state === 'pause') {
    if (['Escape', 'Enter', 'Space'].includes(e.code)) { e.preventDefault(); if (!e.repeat) pauseAction('resume'); }
    else if (e.code === 'KeyR') pauseAction('restart');
    else if (e.code === 'KeyQ' || e.code === 'Backspace') pauseAction('levels');
    return;
  }
  if (e.code === 'Escape' || e.code === 'Backspace') {
    if (state === 'play' || state === 'dead') pause();
    else if (state === 'win') go('levels');
    else if (state !== 'menu') go('menu');
    return;
  }
  if (['menu', 'levels', 'shop'].includes(state) && e.key.length === 1) {
    typed = (typed + e.key.toLowerCase()).slice(-4);
    if (typed === 'gash') unlockSecret('code');
    if (devArmed && state === 'menu' && typed.endsWith('dev')) { devArmed = false; openDevPanel(); return; }
  }
  if (state === 'menu') {
    if (e.code === 'KeyS') return openShop();
    if (e.code === 'KeyO') return go('settings');
  }
  if (state === 'levels' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) { selected = mod(selected + (e.code === 'ArrowLeft' ? -1 : 1), LEVELS.length); sfx('click'); }
  if (state === 'shop') { // up and down switch tabs (landing on what is equipped), left and right pick an item

    if (d) {
      e.preventDefault();
      const tab = Math.max(0, Math.min(KINDS.length - 1, shopTab + d[0]));
      shopSelect(tab, tab !== shopTab ? save.equipped[KINDS[tab]] : shopPick + d[1]);
      return;
    }
  }
  if (e.code === 'Enter') { e.preventDefault(); if (!e.repeat && state !== 'play' && state !== 'dead') press(); return; }
  if (JUMP_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
});
addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) holding = false; });
function toCanvas(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / VIEW.s - VIEW.x, y: (e.clientY - r.top) / VIEW.s - VIEW.y }; }

canvas.addEventListener('pointerleave', () => { mouse = { x: -1, y: -1 }; });
canvas.addEventListener('pointerdown', e => {
  if (!e.isPrimary || e.button !== 0 || activePointerId !== null) return;
  activePointerId = e.pointerId;
  canvas.setPointerCapture?.(e.pointerId);

  const { x: mx, y: my } = mouse = toCanvas(e), hit = b => inBox(b, mx, my);

    if (hit(PLAY_BTN)) go('levels');
    else if (hit(SHOP_BTN)) openShop();
    else if (hit(GEAR_BTN)) go('settings');
    else if (hit(TITLE_BOX) && ++titleClicks >= 7) { titleClicks = 0; unlockSecret('title'); }

  }
  if (state === 'levels') {
    if (hit(BACK_BTN)) return go('menu');
    if (hit(PREV_BTN) || hit(NEXT_BTN)) { selected = mod(selected + (mx < W / 2 ? -1 : 1), LEVELS.length); return sfx('click'); }

    if (pages > 1 && hit(SHOP_NEXT)) { browseShopPage(1); return; }
    KINDS.forEach((k, i) => { if (hit(tabPos(i))) { shopSelect(i, save.equipped[k]); sfx('click'); } });
    const start = Math.floor(shopPick / SHOP_PAGE_SIZE) * SHOP_PAGE_SIZE;
    ITEMS[kind].slice(start, start + SHOP_PAGE_SIZE).forEach((_, slot) => { const i = start + slot; if (hit(boxPos(slot))) { shopSelect(shopTab, i); buyOrEquip(kind, i); } });

});
addEventListener('pointerup', e => {
  if (e.pointerId !== activePointerId) return;

}); // a tap only counts as a user action when it lifts, so touch screens start the sound here
addEventListener('pointercancel', e => { if (e.pointerId === activePointerId) { holding = false; jumpPressed = false; activePointerId = null; drag = null; } });

addEventListener('blur', () => { holding = false; jumpPressed = false; activePointerId = null; pause(); }); // switching away pauses the level, like GD
