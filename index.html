<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deometry Gash</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  canvas { max-width: 100%; touch-action: none; border-radius: 6px; }
  p { margin: 0; opacity: .7; font-size: 14px; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<canvas id="game" width="960" height="480" aria-label="Deometry Gash, a Geometry Dash style game. Pick a level with the arrow keys and Enter, then hold Space, Up or click to jump."></canvas>
<p>Hold <b>Space</b> / <b>↑</b> / <b>click</b> to jump (and fly in the ship). <b>Esc</b> returns to the level menu.</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const T = 40;                 // pixels per tile
const ROWS = 9;               // level height in tiles; also the ship's ceiling
const GROUND = canvas.height - 40;
const PLAYER_SCREEN_X = 6;    // tiles from left edge
const SPEED = 10;             // tiles / second
const GRAVITY = -100;         // tiles / second^2
const JUMP = 21;              // ~2.2 tiles high, ~4 tiles long
const PAD = 28;               // yellow pad launch, ~3.9 tiles high
const SHIP_UP = 60, SHIP_DOWN = 50, SHIP_MAX = 9;
const DT = 1 / 60;

// Level tiles: '#' block, '^' spike, 'v' hanging spike, 'p' jump pad, 'o' jump orb (press while touching),
// 'c' secret coin, 'S' ship portal, 'C' cube portal, '.' empty. seg() takes rows top to bottom; the last row sits on the ground.
// Short rows are padded with '.' on the right.
function seg(...rows) {
  const w = Math.max(...rows.map(r => r.length));
  while (rows.length < ROWS) rows.unshift('');
  return rows.map(r => r.padEnd(w, '.'));
}
const gap = n => seg('.'.repeat(n));

function buildLevel(name, difficulty, stars, hue, segs) {
  segs.forEach((s, i) => console.assert(s.length === ROWS, `${name}: segment ${i} has more than ${ROWS} rows`));
  const rows = [...Array(ROWS)].map((_, r) => segs.map(s => s[r]).join(''));
  const tiles = [];
  rows.forEach((row, r) => [...row].forEach((c, x) => {
    if (c !== '.') tiles.push({ id: tiles.length, x, y: ROWS - 1 - r, type: c });
  }));
  return { name, difficulty, stars, hue, tiles, len: rows[0].length };
}

const LEVELS = [
  buildLevel('First Steps', 'Easy', 2, 220, [
    gap(14),
    seg('....^....'),
    seg('.....^^.....'),
    seg('..............',
        '...#..##....^.'),
    seg('..##^^##^^##....'),
    seg('......c.........',
        '................',
        '................',
        '....p^^^........'),
    seg('....c......',
        '...........',
        '...^^^.....'),
    seg('..........####.......',
        '.......#######.......',
        '....##########..^^...'),
    seg('....^....^^....^....'),
    gap(16),
  ]),
  buildLevel('Orb Garden', 'Normal', 3, 130, [
    gap(14),
    seg('....o......',
        '...........',
        '..^^^^^^...'),
    seg('.........c........',
        '..................',
        '......######......',
        '......######......',
        '...p..######.^^^..'),
    seg('.......c..........',
        '..................',
        '....o....o........',
        '..................',
        '..^^^^^^^^^.......'),
    seg('..#^^^#^^^#^^^#....'),
    seg('..p....o.......',
        '...............',
        '...^^^^^^^^....'),
    seg('...^^^..^^^.....'),
    gap(16),
  ]),
  buildLevel('Sky Rush', 'Hard', 4, 280, [
    gap(14),
    seg('...^....^^.....'),
    seg('..S.........###.......###.......####......###.........C......',
        '..S.........###.......###.......####......###.........C......',
        '..S.........###....c..###.......vvvv......###.........C......',
        '..S...................vvv.................vvv.........C......',
        '',
        '',
        '................###.......###.......^^^......###.............',
        '................###.......###...c...###......###.............',
        '................###.......###.......###......###.............'),
    seg('...^^....^^^.....'),
    gap(16),
  ]),
  buildLevel('Gash Gauntlet', 'Insane', 6, 0, [
    gap(14),
    seg('..^^^...#^^^.....'),
    seg('....o.......',
        '............',
        '..^^^^^^....'),
    seg('..p.....###......',
        '........###......',
        '........###^^^^..'),
    seg('..S......###.c...###.....vvvv....###......C.......',
        '..S......###.....vvv.............###......C.......',
        '..S..............................vvv......C.......',
        '.................................................',
        '.................................................',
        '.................................................',
        '...........^^^.....###...^^^^.....................',
        '...........###.....###...####.....................',
        '...........###.....###...####.................##..'),
    seg('..##^^##^^##^^##....'),
    seg('..........c.....',
        '................',
        '...^^^..o.......',
        '................',
        '.......^^^^^....'),
    gap(16),
  ]),
];

function newPlayer() { return { x: 0, y: 0, vy: 0, grounded: true, rot: 0, mode: 'cube', used: [], coins: [] }; }

// Advances one frame. Returns 'dead', 'win' or null. Only mutates p, so tests can drive it.
function step(p, hold, lvl) {
  let ship = p.mode === 'ship';
  if (!ship && hold && p.grounded) p.vy = JUMP;
  const prevY = p.y;
  p.x += SPEED * DT;
  p.vy = ship ? Math.max(-SHIP_MAX, Math.min(SHIP_MAX, p.vy + (hold ? SHIP_UP : -SHIP_DOWN) * DT)) : p.vy + GRAVITY * DT;
  p.y += p.vy * DT;
  p.grounded = false;
  if (p.y <= 0) { p.y = 0; p.vy = 0; p.grounded = true; }
  if (ship && p.y >= ROWS - 1) { p.y = ROWS - 1; p.vy = 0; }

  for (const t of lvl.tiles) {
    if (p.x + 1 <= t.x + 0.001 || p.x >= t.x + 1 - 0.001) continue;
    const inX = (a, b) => p.x + 1 > t.x + a && p.x < t.x + b;
    const inY = (a, b) => p.y < t.y + b && p.y + 1 > t.y + a;
    switch (t.type) {
      case '^': if (inX(0.3, 0.7) && inY(0, 0.6)) return 'dead'; break;
      case 'v': if (inX(0.3, 0.7) && inY(0.4, 1)) return 'dead'; break;
      case 'p': if (!ship && inX(0.2, 0.8) && inY(0, 0.3)) { p.vy = PAD; p.grounded = false; } break;
      case 'o': if (!ship && hold && inY(0.1, 0.9) && !p.used.includes(t.id)) { p.vy = JUMP; p.grounded = false; p.used = [...p.used, t.id]; } break;
      case 'c': if (inY(0, 1) && !p.coins.includes(t.id)) p.coins = [...p.coins, t.id]; break;
      case 'S': if (!ship) { p.mode = 'ship'; ship = true; p.vy = Math.min(p.vy, 4); } break;
      case 'C': if (ship) { p.mode = 'cube'; ship = false; p.vy = Math.min(p.vy, 0); } break;
      case '#':
        if (!inY(0, 1)) break;
        if (p.vy <= 0 && prevY >= t.y + 1 - 0.01) { p.y = t.y + 1; p.vy = 0; p.grounded = true; }
        else if (ship && p.vy >= 0 && prevY + 1 <= t.y + 0.01) { p.y = t.y - 1; p.vy = 0; } // ship slides under blocks
        else return 'dead'; // hit a wall (or a ceiling as the cube)
    }
  }
  if (ship) p.rot = -p.vy * 0.05;
  else p.rot = p.grounded ? Math.round(p.rot / (Math.PI / 2)) * (Math.PI / 2) : p.rot + 7 * DT;
  return p.x >= lvl.len ? 'win' : null;
}

// ---- Unlockables ----
// Each item unlocks one way: free, by beating a level, by spending stars or coins, or by finding a secret.
const ITEMS = {
  cube: [
    { name: 'Classic', free: true, body: '#ffd400', inner: '#00e5ff' },
    { name: 'Lime', level: 0, body: '#7dff3a', inner: '#1a5c00' },
    { name: 'Ocean', stars: 2, body: '#2b8cff', inner: '#bff3ff' },
    { name: 'Ember', coins: 2, body: '#ff5a1f', inner: '#ffe14d' },
    { name: 'Void', stars: 6, body: '#1b1b1b', inner: '#b84dff' },
    { name: 'Gold', level: 3, body: '#ffcc33', inner: '#fff6c9' },
    { name: 'Glitch', secret: 'title', body: 'glitch', inner: '#000' },
  ],
  ship: [
    { name: 'Rocket', free: true, body: '#ff4fd8', inner: '#ffd400' },
    { name: 'Mint', level: 1, body: '#3dffc1', inner: '#0b3d2e' },
    { name: 'Sky', stars: 3, body: '#9fd8ff', inner: '#ffffff' },
    { name: 'Blood', coins: 3, body: '#c4002b', inner: '#111' },
    { name: 'Ghost', secret: 'deaths', body: '#ffffff66', inner: '#ffffffaa' },
  ],
  death: [
    { name: 'Burst', free: true, icon: '✸' },
    { name: 'Confetti', level: 2, icon: '❋' },
    { name: 'Shockwave', stars: 4, icon: '◎' },
    { name: 'Shatter', coins: 3, icon: '◩' },
    { name: 'Gash', secret: 'code', icon: '✕' },
  ],
};
const KINDS = ['cube', 'ship', 'death'];
const KIND_LABEL = { cube: 'Cubes', ship: 'Ships', death: 'Deaths' };
const SECRETS = {
  title: 'You poked the title until it broke',
  deaths: 'Died 50 times',
  code: 'Typed the secret word',
};

// ---- Save data (stays in this browser) ----
const SAVE_KEY = 'deometry-gash-save';
let save = { best: {}, coins: {}, owned: [], secrets: [], deaths: 0, equipped: { cube: 0, ship: 0, death: 0 } };
try { save = { ...save, ...JSON.parse(localStorage.getItem(SAVE_KEY)) }; } catch {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} };

const beaten = i => save.best[i] === 100;
const sum = (list, f) => list.reduce((n, x) => n + f(x), 0);
const ownedItems = () => save.owned.map(id => { const [k, i] = id.split(':'); return ITEMS[k][i]; });
const starBalance = () => sum(LEVELS, l => beaten(LEVELS.indexOf(l)) ? l.stars : 0) - sum(ownedItems(), it => it.stars || 0);
const coinBalance = () => sum(Object.values(save.coins), c => c.length) - sum(ownedItems(), it => it.coins || 0);
const totalCoins = sum(LEVELS, l => l.tiles.filter(t => t.type === 'c').length);

function unlocked(kind, i) {
  const it = ITEMS[kind][i];
  return it.free || save.owned.includes(`${kind}:${i}`) || (it.level !== undefined && beaten(it.level)) || (it.secret && save.secrets.includes(it.secret));
}
function howToGet(it) {
  if (it.level !== undefined) return `Beat ${LEVELS[it.level].name}`;
  if (it.stars) return `${it.stars} ★`;
  if (it.coins) return `${it.coins} ◉`;
  return 'Secret';
}
const skin = kind => ITEMS[kind][save.equipped[kind]] || ITEMS[kind][0];

let toast = null;
function say(text) { toast = { text, t: 2.5 }; }
function unlockSecret(id) {
  if (save.secrets.includes(id)) return;
  save.secrets.push(id); persist();
  const it = KINDS.map(k => ITEMS[k].find(x => x.secret === id)).find(Boolean);
  say(`Secret found: ${SECRETS[id]}! Unlocked ${it.name}.`);
}
function buyOrEquip(kind, i) {
  const it = ITEMS[kind][i];
  if (!unlocked(kind, i)) {
    if (it.stars && starBalance() >= it.stars) save.owned.push(`${kind}:${i}`);
    else if (it.coins && coinBalance() >= it.coins) save.owned.push(`${kind}:${i}`);
    else return say(it.stars ? 'Not enough stars. Beat levels to earn more.' : it.coins ? 'Not enough coins. Find them hidden in levels.' : `Locked: ${howToGet(it)}.`);
    say(`Bought ${it.name}!`);
  }
  save.equipped[kind] = i; persist();
}

// ---- Game state ----
let state = 'menu', selected = 0, level = LEVELS[0], player = newPlayer(), stateTime = 0, attempts = 1, holding = false;
let particles = [], winNote = '', shopRow = 0, shopCol = 0, titleClicks = 0, typed = '';

function startLevel(i) {
  selected = i; level = LEVELS[i]; player = newPlayer(); attempts = 1; particles = [];
  state = 'play'; stateTime = 0; holding = false;
}
const progress = () => Math.min(100, Math.floor(player.x / level.len * 100));

function finishLevel() {
  const firstClear = !beaten(selected);
  const had = save.coins[selected] || [];
  const coins = [...new Set([...had, ...player.coins])];
  save.best[selected] = 100; save.coins[selected] = coins; persist();
  const notes = [];
  if (firstClear) notes.push(`+${level.stars} ★`);
  if (coins.length > had.length) notes.push(`+${coins.length - had.length} ◉`);
  KINDS.forEach(k => ITEMS[k].forEach(it => { if (firstClear && it.level === selected) notes.push(`Unlocked ${it.name}!`); }));
  winNote = notes.join('   ');
}

function die() {
  save.best[selected] = Math.max(save.best[selected] || 0, progress());
  save.deaths++; persist();
  if (save.deaths >= 50) unlockSecret('deaths');
  const x = player.x + 0.5, y = player.y + 0.5, color = player.mode === 'ship' ? skin('ship').body : skin('cube').body;
  const c = color === 'glitch' ? '#0f0' : color.slice(0, 7);
  const add = o => particles.push({ x, y, vx: 0, vy: 0, g: 0, age: 0, life: 0.7, size: 8, color: c, ...o });
  const spray = (n, speed, o = {}) => {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random() * 0.7);
      add({ vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, ...(typeof o === 'function' ? o() : o) });
    }
  };
  switch (skin('death').name) {
    case 'Burst': spray(30, 10); break;
    case 'Confetti': spray(70, 14, () => ({ g: -30, life: 1.2, size: 6, color: `hsl(${Math.random() * 360} 90% 60%)` })); break;
    case 'Shockwave':
      for (let i = 0; i < 3; i++) add({ ring: 7 + i * 4, life: 0.5 + i * 0.15 });
      spray(12, 6); break;
    case 'Shatter':
      for (const [dx, dy] of [[-1, 1], [1, 1], [-1, -1], [1, -1]]) add({ x: x + dx / 4, y: y + dy / 4, vx: dx * (3 + Math.random() * 3), vy: 6 + dy * 3, g: -40, life: 1, size: T / 2 });
      break;
    case 'Gash':
      for (const a of [Math.PI / 4, -Math.PI / 4]) add({ slash: a, life: 0.6, color: '#ff1e3c' });
      spray(25, 9, { color: '#ff1e3c' }); break;
  }
}

// ---- Drawing ----
function drawTile(t, x, y) {
  ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#000';
  switch (t.type) {
    case '#':
      ctx.fillRect(x, y, T, T); ctx.strokeRect(x + 1, y + 1, T - 2, T - 2); break;
    case '^': case 'v': {
      const tip = t.type === '^' ? y + 2 : y + T - 2, base = t.type === '^' ? y + T : y;
      ctx.beginPath(); ctx.moveTo(x + 2, base); ctx.lineTo(x + T / 2, tip); ctx.lineTo(x + T - 2, base); ctx.closePath();
      ctx.fill(); ctx.stroke(); break;
    }
    case 'p':
      ctx.fillStyle = '#ffd400';
      ctx.beginPath(); ctx.ellipse(x + T / 2, y + T, T * 0.4, T * 0.2, 0, Math.PI, 0); ctx.fill(); break;
    case 'o': {
      const used = player.used.includes(t.id);
      ctx.strokeStyle = '#ffd400'; ctx.fillStyle = used ? '#ffd40033' : '#ffd400aa'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x + T / 2, y + T / 2, T * 0.32, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); break;
    }
    case 'c': {
      if (player.coins.includes(t.id)) break;
      const old = (save.coins[selected] || []).includes(t.id); // already banked: drawn faded, like GD
      const wob = Math.sin(performance.now() / 200) * 3;
      ctx.fillStyle = old ? '#8899ff66' : '#ffcc33'; ctx.strokeStyle = old ? '#ccd4ff88' : '#a86b00'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x + T / 2, y + T / 2 + wob, T * 0.35, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + T / 2, y + T / 2 + wob, T * 0.18, 0, Math.PI * 2); ctx.stroke(); break;
    }
    case 'S': case 'C': {
      if (level.tiles.some(o => o.x === t.x && o.y === t.y + 1 && o.type === t.type)) break; // draw each portal once, from its top tile
      const tall = level.tiles.filter(o => o.x === t.x && o.type === t.type).length;
      ctx.strokeStyle = t.type === 'S' ? '#ff4fd8' : '#4fff7a'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(x + T / 2, y + tall * T / 2, T * 0.35, tall * T / 2, 0, 0, Math.PI * 2); ctx.stroke(); break;
    }
  }
}

const bodyColor = s => s.body === 'glitch' ? `hsl(${Math.floor(performance.now() / 80) * 47 % 360} 100% 55%)` : s.body;

function drawCube(cx, cy, rot, s, size = T) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.fillStyle = bodyColor(s); ctx.fillRect(-size / 2, -size / 2, size, size);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeRect(-size / 2 + 1.5, -size / 2 + 1.5, size - 3, size - 3);
  ctx.fillStyle = s.inner; ctx.fillRect(-size / 4, -size / 4, size / 2, size / 2);
  ctx.restore();
}

function drawShip(cx, cy, rot, s, size = T) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(size / T, size / T);
  ctx.fillStyle = s.body; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-T / 2, T / 4); ctx.lineTo(T / 2, T / 6); ctx.lineTo(-T / 4, -T / 6); ctx.lineTo(-T / 2, -T / 10); ctx.closePath();
  ctx.fill(); ctx.stroke();
  drawCube(-T / 12, -T / 4, 0, skin('cube'), T / 2.5); // the cube rides in the ship
  ctx.fillStyle = s.inner; ctx.fillRect(-T / 2.5, T / 20, T / 1.6, T / 12);
  ctx.restore();
}

function drawWorld() {
  const camX = player.x - PLAYER_SCREEN_X;
  const sx = x => (x - camX) * T, sy = y => GROUND - y * T;
  const hue = level.hue + Math.sin(player.x / 15) * 25;
  ctx.fillStyle = `hsl(${hue} 60% 22%)`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Parallax squares for a sense of speed
  ctx.fillStyle = `hsl(${hue} 60% 27%)`;
  for (let i = 0; i < 12; i++) {
    const px = ((i * 173 - camX * T * 0.3) % 1200 + 1200) % 1200 - 120, py = (i * 97) % (GROUND - 120) + 20;
    ctx.fillRect(px, py, 70, 70);
  }
  ctx.fillStyle = `hsl(${hue} 60% 12%)`;
  ctx.fillRect(0, GROUND, canvas.width, canvas.height - GROUND);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, GROUND, canvas.width, 2);
  if (player.mode === 'ship') ctx.fillRect(0, sy(ROWS), canvas.width, 2);

  for (const t of level.tiles) {
    const x = sx(t.x);
    if (x > -T * 2 && x < canvas.width) drawTile(t, x, sy(t.y + 1));
  }
  ctx.fillStyle = '#fff8'; ctx.fillRect(sx(level.len), 0, 6, GROUND);

  if (state !== 'dead') {
    const cx = sx(player.x) + T / 2, cy = sy(player.y) - T / 2;
    if (player.mode === 'ship') drawShip(cx, cy, player.rot, skin('ship'));
    else drawCube(cx, cy, player.rot, skin('cube'));
  }
  for (const q of particles) {
    ctx.globalAlpha = Math.max(0, 1 - q.age / q.life);
    const px = sx(q.x), py = sy(q.y);
    if (q.ring) {
      ctx.strokeStyle = q.color; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(px, py, q.age * q.ring * T, 0, Math.PI * 2); ctx.stroke();
    } else if (q.slash !== undefined) {
      const len = Math.min(1, q.age * 8) * T * 1.6;
      ctx.strokeStyle = q.color; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(px - Math.cos(q.slash) * len, py - Math.sin(q.slash) * len);
      ctx.lineTo(px + Math.cos(q.slash) * len, py + Math.sin(q.slash) * len); ctx.stroke();
    } else {
      ctx.fillStyle = q.color; ctx.fillRect(px - q.size / 2, py - q.size / 2, q.size, q.size);
    }
  }
  ctx.globalAlpha = 1;
  if (state === 'dead') {
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, 0.4 - stateTime)})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  const pct = progress();
  ctx.fillStyle = '#fff3'; ctx.fillRect(canvas.width / 2 - 150, 14, 300, 10);
  ctx.fillStyle = '#7f7'; ctx.fillRect(canvas.width / 2 - 150, 14, 3 * pct, 10);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(`${pct}%`, canvas.width / 2 + 180, 25);
  ctx.textAlign = 'left'; ctx.fillText(`Attempt ${attempts}`, 16, 25);
  ctx.textAlign = 'right'; ctx.fillText(`${level.name}  ${'◉'.repeat(player.coins.length)}`, canvas.width - 16, 25);
  if (state === 'win') {
    ctx.fillStyle = '#0008'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 48px system-ui';
    ctx.fillText('Level Complete!', canvas.width / 2, canvas.height / 2 - 30);
    ctx.font = 'bold 22px system-ui'; ctx.fillStyle = '#ffd400';
    ctx.fillText(winNote, canvas.width / 2, canvas.height / 2 + 10);
    ctx.font = '18px system-ui'; ctx.fillStyle = '#fff';
    ctx.fillText(`${attempts} attempt${attempts > 1 ? 's' : ''}. Press jump for the menu.`, canvas.width / 2, canvas.height / 2 + 45);
  }
}

const CARD_W = 200, CARD_H = 170, CARD_Y = 160;
const cardX = i => canvas.width / 2 - (LEVELS.length * (CARD_W + 20) - 20) / 2 + i * (CARD_W + 20);
const SHOP_BTN = { x: canvas.width / 2 - 90, y: 370, w: 180, h: 48 };
const BACK_BTN = { x: 16, y: 14, w: 90, h: 34 };
const TITLE_BOX = { x: canvas.width / 2 - 220, y: 45, w: 440, h: 70 };
const inBox = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

function drawBalance() {
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'right';
  ctx.fillText(`${starBalance()} ★   ${coinBalance()} ◉`, canvas.width - 20, 36);
}

function drawMenu() {
  ctx.fillStyle = '#181828'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawBalance();
  ctx.fillStyle = '#ffd400'; ctx.textAlign = 'center'; ctx.font = 'bold 56px system-ui';
  ctx.fillText('Deometry Gash', canvas.width / 2 + (titleClicks ? Math.random() * titleClicks * 2 : 0), 100);
  ctx.fillStyle = '#fff9'; ctx.font = '16px system-ui';
  ctx.fillText('← → to choose, Enter / Space / click to play, S for the shop', canvas.width / 2, 135);
  LEVELS.forEach((l, i) => {
    const x = cardX(i), sel = i === selected;
    ctx.fillStyle = `hsl(${l.hue} 60% ${sel ? 35 : 22}%)`; ctx.fillRect(x, CARD_Y, CARD_W, CARD_H);
    ctx.strokeStyle = sel ? '#ffd400' : '#fff4'; ctx.lineWidth = sel ? 4 : 2; ctx.strokeRect(x, CARD_Y, CARD_W, CARD_H);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px system-ui'; ctx.fillText(l.name, x + CARD_W / 2, CARD_Y + 45);
    ctx.font = '16px system-ui'; ctx.fillStyle = '#fffb';
    ctx.fillText(`${l.difficulty} · ${l.stars} ★`, x + CARD_W / 2, CARD_Y + 72);
    const coins = l.tiles.filter(t => t.type === 'c'), got = save.coins[i] || [];
    ctx.fillText(coins.map(t => got.includes(t.id) ? '◉' : '○').join(' '), x + CARD_W / 2, CARD_Y + 98);
    const b = save.best[i] || 0;
    ctx.fillStyle = '#fff3'; ctx.fillRect(x + 20, CARD_Y + 115, CARD_W - 40, 10);
    ctx.fillStyle = b === 100 ? '#ffd400' : '#7f7'; ctx.fillRect(x + 20, CARD_Y + 115, (CARD_W - 40) * b / 100, 10);
    ctx.fillStyle = '#fff'; ctx.fillText(b === 100 ? 'Complete ★' : `Best ${b}%`, x + CARD_W / 2, CARD_Y + 150);
  });
  ctx.fillStyle = '#ffd400'; ctx.fillRect(SHOP_BTN.x, SHOP_BTN.y, SHOP_BTN.w, SHOP_BTN.h);
  ctx.fillStyle = '#000'; ctx.font = 'bold 22px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('Shop', canvas.width / 2, SHOP_BTN.y + 32);
  ctx.fillStyle = '#fff6'; ctx.font = '14px system-ui';
  ctx.fillText(`Coins found: ${sum(Object.values(save.coins), c => c.length)} / ${totalCoins}   ·   Secrets found: ${save.secrets.length} / ${Object.keys(SECRETS).length}`, canvas.width / 2, 450);
}

const BOX = 104;
const boxPos = (r, c) => ({ x: 170 + c * (BOX + 8), y: 70 + r * (BOX + 30), w: BOX, h: BOX });

function drawShop() {
  ctx.fillStyle = '#181828'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawBalance();
  ctx.fillStyle = '#fff2'; ctx.fillRect(BACK_BTN.x, BACK_BTN.y, BACK_BTN.w, BACK_BTN.h);
  ctx.fillStyle = '#fff'; ctx.font = '16px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('← Back', BACK_BTN.x + BACK_BTN.w / 2, BACK_BTN.y + 22);
  ctx.font = 'bold 32px system-ui'; ctx.fillText('Shop', canvas.width / 2, 42);
  KINDS.forEach((kind, r) => {
    const top = boxPos(r, 0).y;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'right';
    ctx.fillText(KIND_LABEL[kind], 155, top + BOX / 2 + 7);
    ITEMS[kind].forEach((it, c) => {
      const b = boxPos(r, c), open = unlocked(kind, c), on = save.equipped[kind] === c, sel = r === shopRow && c === shopCol;
      ctx.fillStyle = on ? '#2d4a2d' : '#262640'; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = sel ? '#ffd400' : on ? '#7f7' : '#fff3'; ctx.lineWidth = sel ? 4 : 2; ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.globalAlpha = open ? 1 : 0.35;
      const cx = b.x + b.w / 2, cy = b.y + 38;
      if (kind === 'cube') drawCube(cx, cy, 0, it, 36);
      else if (kind === 'ship') drawShip(cx, cy, 0, it, 44);
      else { ctx.fillStyle = it.name === 'Gash' ? '#ff1e3c' : '#fff'; ctx.font = '34px system-ui'; ctx.textAlign = 'center'; ctx.fillText(it.icon, cx, cy + 12); }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff'; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(open || !it.secret ? it.name : '???', cx, b.y + 76);
      ctx.font = '11px system-ui'; ctx.fillStyle = on ? '#7f7' : open ? '#fffa' : '#ffd400';
      ctx.fillText(on ? 'Equipped' : open ? 'Click to equip' : howToGet(it), cx, b.y + 94);
    });
  });
}

function drawToast() {
  if (!toast) return;
  ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'center';
  const w = ctx.measureText(toast.text).width + 40;
  ctx.globalAlpha = Math.min(1, toast.t * 2);
  ctx.fillStyle = '#000c'; ctx.fillRect(canvas.width / 2 - w / 2, canvas.height - 64, w, 40);
  ctx.fillStyle = '#ffd400'; ctx.fillText(toast.text, canvas.width / 2, canvas.height - 38);
  ctx.globalAlpha = 1;
}

// ---- Loop ----
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.25, (now - last) / 1000); last = now;
  while (acc >= DT) {
    acc -= DT; stateTime += DT;
    if (toast && (toast.t -= DT) <= 0) toast = null;
    for (const q of particles) { q.vy += q.g * DT; q.x += q.vx * DT; q.y += q.vy * DT; q.age += DT; }
    particles = particles.filter(q => q.age < q.life);
    if (state === 'play') {
      const r = step(player, holding, level);
      if (r === 'dead') die();
      if (r === 'win') finishLevel();
      if (r) { state = r; stateTime = 0; }
    } else if (state === 'dead' && stateTime > 0.8) {
      player = newPlayer(); state = 'play'; attempts++;
    }
  }
  if (state === 'menu') drawMenu(); else if (state === 'shop') drawShop(); else drawWorld();
  drawToast();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- Input ----
function press() {
  if (state === 'menu') startLevel(selected);
  else if (state === 'shop') buyOrEquip(KINDS[shopRow], shopCol);
  else if (state === 'win' && stateTime > 0.5) state = 'menu';
  else holding = true;
}
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'Enter'];
addEventListener('keydown', e => {
  if (e.code === 'Escape' || (state === 'shop' && e.code === 'Backspace')) { state = 'menu'; holding = false; return; }
  if ((state === 'menu' || state === 'shop') && e.key.length === 1) {
    typed = (typed + e.key.toLowerCase()).slice(-4);
    if (typed === 'gash') unlockSecret('code');
  }
  if (state === 'menu') {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') selected = (selected + (e.code === 'ArrowLeft' ? LEVELS.length - 1 : 1)) % LEVELS.length;
    if (e.code === 'KeyS') { state = 'shop'; return; }
  }
  if (state === 'shop') {
    const d = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.code];
    if (d) {
      e.preventDefault();
      shopRow = Math.max(0, Math.min(KINDS.length - 1, shopRow + d[0]));
      shopCol = Math.max(0, Math.min(ITEMS[KINDS[shopRow]].length - 1, shopCol + d[1]));
      return;
    }
  }
  if (JUMP_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
});
addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) holding = false; });
canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect(), mx = (e.clientX - r.left) * canvas.width / r.width, my = (e.clientY - r.top) * canvas.height / r.height;
  if (state === 'menu') {
    if (inBox(SHOP_BTN, mx, my)) { state = 'shop'; return; }
    if (inBox(TITLE_BOX, mx, my) && ++titleClicks >= 7) { titleClicks = 0; unlockSecret('title'); }
    const i = LEVELS.findIndex((_, i) => mx >= cardX(i) && mx <= cardX(i) + CARD_W && my >= CARD_Y && my <= CARD_Y + CARD_H);
    if (i >= 0) startLevel(i);
    return;
  }
  if (state === 'shop') {
    if (inBox(BACK_BTN, mx, my)) { state = 'menu'; return; }
    KINDS.forEach((kind, row) => ITEMS[kind].forEach((_, col) => {
      if (inBox(boxPos(row, col), mx, my)) { shopRow = row; shopCol = col; buyOrEquip(kind, col); }
    }));
    return;
  }
  press();
});
addEventListener('pointerup', () => holding = false);
addEventListener('blur', () => holding = false);
</script>
