const BALL_G = 60, BALL_KICK = 6, BALL_MAX = 24; // the ball falls toward its gravity and flips it on a press

// Level tiles: '#' block, '^' spike, 'v' hanging spike, 'p' jump pad, 'o' jump orb (press while touching),
// 'c' secret coin, portals 'S' ship, 'C' cube, 'B' ball, 'W' wave, '.' empty. seg() takes rows top to bottom; the last
// row sits on the ground. Short rows are padded with '.' on the right.
const PORTAL_MODE = { S: 'ship', C: 'cube', B: 'ball', W: 'wave' };
function seg(...rows) {
  const w = Math.max(...rows.map(r => r.length));
  while (rows.length < ROWS) rows.unshift('');
  return rows.map(r => r.padEnd(w, '.'));
}
const gap = n => seg('.'.repeat(n));

function buildLevel(name, difficulty, stars, hue, segs) {
  segs.forEach((s, i) => console.assert(s.length === ROWS, `${name}: segment ${i} has more than ${ROWS} rows`));
  const rows = [...Array(ROWS)].map((_, r) => segs.map(s => s[r]).join(''));
  const tiles = [];
  rows.forEach((row, r) => [...row].forEach((c, x) => {
    if (c !== '.') tiles.push({ id: tiles.length, x, y: ROWS - 1 - r, type: c });
  }));
  // Precompute what the renderer needs: which block edges are exposed (so stacked blocks
  // outline as one shape), and how tall each portal is (only its top tile draws it).
  const at = new Map(tiles.map(t => [`${t.x},${t.y}`, t.type]));
  const is = (x, y, type) => at.get(`${x},${y}`) === type;
  for (const t of tiles) {
    if (t.type === '#') t.open = { top: !is(t.x, t.y + 1, '#'), bottom: !is(t.x, t.y - 1, '#'), left: !is(t.x - 1, t.y, '#'), right: !is(t.x + 1, t.y, '#') };
    if (t.type in PORTAL_MODE && !is(t.x, t.y + 1, t.type)) {
      let n = 1;
      while (is(t.x, t.y - n, t.type)) n++;
      t.tall = n;
    }
  }
  return { name, difficulty, stars, hue, tiles, len: rows[0].length, coinTiles: tiles.filter(t => t.type === 'c') };
}

function newPlayer() { return { x: 0, y: 0, vy: 0, grounded: true, rot: 0, mode: 'cube', grav: 1, used: [], coins: [] }; }
const clamp = (v, m) => Math.max(-m, Math.min(m, v));

// Advances one frame. Returns 'dead', 'win' or null. Only mutates p, so tests can drive it.
// The cube jumps, the ship flies up while held, the ball flips its gravity and the wave climbs while held.
// Every mode but the cube has a ceiling and can slide along the underside of blocks.
function step(p, hold, lvl) {
  const m = p.mode;
  if (m === 'cube' && hold && p.grounded) p.vy = JUMP;
  if (m === 'ball' && hold && p.grounded) { p.grav = -p.grav; p.vy = -p.grav * BALL_KICK; }
  const prevY = p.y;
  p.x += SPEED * DT;
  if (m === 'ship') p.vy = clamp(p.vy + (hold ? SHIP_UP : -SHIP_DOWN) * DT, SHIP_MAX);
  else if (m === 'wave') p.vy = hold ? WAVE : -WAVE;
  else if (m === 'ball') p.vy = clamp(p.vy - BALL_G * p.grav * DT, BALL_MAX);
  else p.vy += GRAVITY * DT;
  p.y += p.vy * DT;
  const flipped = m === 'ball' && p.grav < 0; // a flipped ball stands on ceilings
  p.grounded = false;
  if (p.y <= 0) { p.y = 0; p.vy = 0; p.grounded = !flipped; }
  if (m !== 'cube' && p.y >= ROWS - 1) { p.y = ROWS - 1; p.vy = 0; p.grounded = flipped; }

  for (const t of lvl.tiles) {
    if (p.x + 1 <= t.x + 0.001 || p.x >= t.x + 1 - 0.001) continue;
    const inX = (a, b) => p.x + 1 > t.x + a && p.x < t.x + b;
    const inY = (a, b) => p.y < t.y + b && p.y + 1 > t.y + a;
    switch (t.type) {
      case '^': if (inX(0.3, 0.7) && inY(0, 0.6)) return 'dead'; break;
      case 'v': if (inX(0.3, 0.7) && inY(0.4, 1)) return 'dead'; break;
      case 'p': if (p.mode === 'cube' && inX(0.2, 0.8) && inY(0, 0.3)) { p.vy = PAD; p.grounded = false; } break;
      case 'o': if (p.mode === 'cube' && hold && inY(0.1, 0.9) && !p.used.includes(t.id)) { p.vy = JUMP; p.grounded = false; p.used = [...p.used, t.id]; } break;
      case 'c': if (inY(0, 1) && !p.coins.includes(t.id)) p.coins = [...p.coins, t.id]; break;
      case 'S': case 'C': case 'B': case 'W': {
        const to = PORTAL_MODE[t.type];
        if (p.mode !== to) {
          if (to === 'ship') p.vy = Math.min(p.vy, 4);
          else if (to !== 'wave') p.vy = Math.min(p.vy, 0);
          p.mode = to; p.grav = 1;
        }
        break;
      }
      case '#':
        if (!inY(0, 1)) break;
        if (p.vy <= 0 && prevY >= t.y + 1 - 0.01) { p.y = t.y + 1; p.vy = 0; p.grounded = p.grav > 0; }
        else if (p.mode !== 'cube' && p.vy >= 0 && prevY + 1 <= t.y + 0.01) { p.y = t.y - 1; p.vy = 0; p.grounded = p.grav < 0; } // slide under blocks
        else return 'dead'; // hit a wall (or a ceiling as the cube)
    }
  }
  if (p.mode === 'ship') p.rot = -p.vy * 0.05;
  else if (p.mode === 'wave') p.rot = p.vy > 0 ? -Math.PI / 4 : p.vy < 0 ? Math.PI / 4 : 0;
  else if (p.mode === 'ball') p.rot += p.grav * 12 * DT;
  else p.rot = p.grounded ? Math.round(p.rot / (Math.PI / 2)) * (Math.PI / 2) : p.rot + 7 * DT;
  return p.x >= lvl.len ? 'win' : null;
}

const KINDS = ['cube', 'ship', 'ball', 'wave', 'trail', 'death'];
const KIND_LABEL = { cube: 'Cubes', ship: 'Ships', ball: 'Balls', wave: 'Waves', trail: 'Trails', death: 'Deaths' };
const MODE_KINDS = ['cube', 'ship', 'ball', 'wave']; // kinds that are also game modes
const SECRETS = {
  title: 'You poked the title until it broke',
  deaths: 'Died 50 times',
  code: 'Typed the secret word',
  konami: 'Entered the ancient code',
  jumps: 'Jumped 1000 times',
  close: 'Crashed at 90% or more',
};
const SECRET_HINTS = {
  title: 'Secret. Hint: the title screen is ticklish.',
  deaths: 'Secret. Hint: every crash counts.',
  code: 'Secret. Hint: on the menu, spell out how this game ends.',
  konami: 'Secret. Hint: up, up, down, down... you know the rest.',
  jumps: 'Secret. Hint: just keep jumping.',
  close: 'Secret. Hint: so close, yet so far.',
};
const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'KeyB', 'KeyA'];

// ---- Save data (stays in this browser) ----
const SAVE_KEY = 'deometry-gash-save';
const EQUIPPED = { cube: 0, ship: 0, ball: 0, wave: 0, trail: 0, death: 0 };
let save = { v: 2, best: {}, coins: {}, owned: [], secrets: [], deaths: 0, jumps: 0, equipped: EQUIPPED };
// Version 1 saves stored coin tile ids from before the portals moved down to where the player passes them.
const COIN_IDS_V1 = { 2: { 34: 29, 72: 71 }, 3: { 4: 3, 32: 28 } };
try {
  const old = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (old && !old.v) for (const i in old.coins) if (Array.isArray(old.coins[i])) old.coins[i] = old.coins[i].map(id => COIN_IDS_V1[i]?.[id] ?? id);
  save = { ...save, ...old };
} catch {}
save.equipped = { ...EQUIPPED, ...save.equipped }; // saves from before new kinds existed
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} };

const beaten = i => save.best[i] === 100;
const sum = (list, f) => list.reduce((n, x) => n + f(x), 0);
const ownedItems = () => save.owned.map(id => { const [k, i] = id.split(':'); return ITEMS[k][i]; });
const starBalance = () => sum(LEVELS, l => beaten(LEVELS.indexOf(l)) ? l.stars : 0) - sum(ownedItems(), it => it.stars || 0);
const coinBalance = () => sum(Object.values(save.coins), c => c.length) - sum(ownedItems(), it => it.coins || 0);
const totalCoins = sum(LEVELS, l => l.coinTiles.length);

function unlocked(kind, i) {
  const it = ITEMS[kind][i];
  return it.free || save.owned.includes(`${kind}:${i}`) || (it.level !== undefined && beaten(it.level)) || (it.secret && save.secrets.includes(it.secret));
}
function describe(kind, i) {
  const it = ITEMS[kind][i];
  if (save.equipped[kind] === i) return `${it.name} is equipped.`;
  if (unlocked(kind, i)) return `${it.name}: press Enter or click to equip.`;
  if (it.level !== undefined) return `Beat ${LEVELS[it.level].name} to unlock ${it.name}.`;
  if (it.stars) return `${it.name} costs ${it.stars} stars. You have ${starBalance()}. Beat levels to earn more.`;
  if (it.coins) return `${it.name} costs ${it.coins} coins. You have ${coinBalance()}. Coins are hidden in the levels.`;
  return SECRET_HINTS[it.secret];
}
const skin = kind => ITEMS[kind][save.equipped[kind]] || ITEMS[kind][0];

let toast = null;
function say(text) { toast = { text, t: 2.5 }; }
function unlockSecret(id) {
  if (save.secrets.includes(id)) return;
  save.secrets.push(id); persist();
  const it = KINDS.map(k => ITEMS[k].find(x => x.secret === id)).find(Boolean);
  say(`Secret found: ${SECRETS[id]}! Unlocked ${it.name}.`);
}
function buyOrEquip(kind, i) {
  const it = ITEMS[kind][i];
  if (!unlocked(kind, i)) {
    if (it.stars && starBalance() >= it.stars) save.owned.push(`${kind}:${i}`);
    else if (it.coins && coinBalance() >= it.coins) save.owned.push(`${kind}:${i}`);
    else return say(it.stars ? 'Not enough stars. Beat levels to earn more.' : it.coins ? 'Not enough coins. Find them hidden in levels.' : it.secret ? 'This one is a secret...' : `Locked: beat ${LEVELS[it.level].name}.`);
    say(`Bought ${it.name}!`);
  }
  save.equipped[kind] = i; persist();
}

// ---- Game state ----
let state = 'menu', selected = 0, level = LEVELS[0], player = newPlayer(), stateTime = 0, attempts = 1, holding = false;
let particles = [], history = [], winNote = '', shopTab = 0, shopPick = 0, titleClicks = 0, typed = '', keys = [];
let visRot = 0, shake = 0, ceilAnim = 0, menuScroll = 0, mouse = { x: -1, y: -1 }, cursorHot = false;

function startLevel(i) {
  selected = i; level = LEVELS[i]; player = newPlayer(); attempts = 1; particles = []; history = [];
  visRot = 0; shake = 0; ceilAnim = 0; state = 'play'; stateTime = 0; holding = false;
}
const progress = () => Math.min(100, Math.floor(player.x / level.len * 100));

// ---- Particles ----
// Particles use tile units with y pointing up. Optional flags: ring (expanding circle), slash (angle of a cut),
// spin (rotating square), add (additive glow), shrink, outline, shape ('circle', 'blob', 'sparkle', 'star' or 'spirit'),
// bolt (points of a jagged line), orbit (spirals into a point) and burst (sparks to spray when it expires).
function emit(list, o) { list.push({ x: 0, y: 0, vx: 0, vy: 0, g: 0, age: 0, life: 0.6, size: 6, color: '#fff', ...o }); }
function spray(list, n, x, y, speed, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = speed * (0.3 + Math.random() * 0.7);
    emit(list, { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.4, ...(typeof o === 'function' ? o() : o) });
  }
}
function updateParticles(list) {
  const out = [];
  for (const q of list) {
    q.age += DT;
    if (q.orbit) { const o = q.orbit, r = o.r * Math.max(0, 1 - q.age / q.life), a = o.a + q.age * o.spin; q.x = o.x + Math.cos(a) * r; q.y = o.y + Math.sin(a) * r; }
    else { q.vy += q.g * DT; q.x += q.vx * DT; q.y += q.vy * DT; }
    if (q.age < q.life) out.push(q);
    else if (q.burst) spray(out, q.burst, q.x, q.y, 9, () => ({ color: q.color, add: true, shrink: true, size: 6, g: -8, life: 0.5 + Math.random() * 0.4 }));
  }
  return out;
}
function drawParticles(list, toX, toY, scale = 1) {
  for (const q of list) {
    const k = q.age / q.life, px = toX(q), py = toY(q), s = q.size * scale * (q.shrink ? 1 - k : 1);
    ctx.globalAlpha = Math.max(0, 1 - k);
    ctx.globalCompositeOperation = q.add ? 'lighter' : 'source-over';
    if (q.ring) {
      ctx.strokeStyle = q.color; ctx.lineWidth = (4 * (1 - k) + 1) * scale;
      ctx.beginPath(); ctx.arc(px, py, Math.max(0, q.ring > 0 ? 0.25 + q.age * q.ring : 1.5 + q.age * q.ring * 2.4) * T * scale, 0, TAU); ctx.stroke();
    } else if (q.slash !== undefined) {
      const len = Math.min(1, q.age * 8) * T * 1.6 * scale, dx = Math.cos(q.slash) * len, dy = Math.sin(q.slash) * len;
      ctx.strokeStyle = q.color; ctx.lineWidth = 7 * scale * (1 - k * 0.7); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(px - dx, py - dy); ctx.lineTo(px + dx, py + dy); ctx.stroke(); ctx.lineCap = 'butt';
    } else if (q.bolt) {
      if (Math.random() < 0.3) ctx.globalAlpha *= 0.35; // flicker
      ctx.strokeStyle = q.color; ctx.lineWidth = 3 * scale; ctx.lineJoin = 'round'; ctx.shadowColor = q.color; ctx.shadowBlur = 10;
      ctx.beginPath(); q.bolt.forEach(([dx, dy], i) => ctx[i ? 'lineTo' : 'moveTo'](px + dx * T * scale, py - dy * T * scale)); ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (q.spin) {
      ctx.save(); ctx.translate(px, py); ctx.rotate(q.age * q.spin);
      ctx.fillStyle = q.color; ctx.fillRect(-s / 2, -s / 2, s, s);
      if (q.outline) { ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.strokeRect(-s / 2, -s / 2, s, s); }
      ctx.restore();
    } else if (q.shape === 'circle') {
      ctx.strokeStyle = q.color; ctx.lineWidth = 1.6 * scale; ctx.beginPath(); ctx.arc(px, py, s / 2, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(px - s / 5, py - s / 5, 2 * scale, 2 * scale);
    } else if (q.shape === 'blob') {
      ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(px, py, s / 2, 0, TAU); ctx.fill();
    } else if (q.shape === 'sparkle') {
      sparkle(px, py, s / 2, q.color);
    } else if (q.shape === 'star') {
      starPath(px, py, s / 2); ctx.fillStyle = q.color; ctx.fill();
    } else if (q.shape === 'spirit') {
      drawSpirit(px + Math.sin(q.age * 7) * 4 * scale, py, s, q.color);
    } else {
      ctx.fillStyle = q.color; ctx.fillRect(px - s / 2, py - s / 2, s, s);
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

const jag = (a, len) => [...Array(7)].map((_, k) => { // a jagged lightning line along angle a
  const d = k / 6 * len, o = k && k < 6 ? (Math.random() - 0.5) * 0.55 : 0;
  return [Math.cos(a) * d - Math.sin(a) * o, Math.sin(a) * d + Math.cos(a) * o];
});

function deathEffect(list, x, y, name, color) {
  switch (name) {
    case 'Burst':
      emit(list, { x, y, ring: 6, life: 0.35, color: '#fff', add: true });
      spray(list, 28, x, y, 11, { color, add: true, shrink: true, size: 9 });
      spray(list, 12, x, y, 6, { color: '#fff', add: true, size: 4 });
      break;
    case 'Confetti':
      spray(list, 70, x, y, 14, () => ({ g: -30, life: 1.2, size: 7, spin: (Math.random() - 0.5) * 20, color: `hsl(${Math.random() * 360},90%,60%)` }));
      break;
    case 'Shockwave':
      for (let i = 0; i < 3; i++) emit(list, { x, y, ring: 7 + i * 4, life: 0.5 + i * 0.15, color, add: true });
      spray(list, 14, x, y, 6, { color, add: true, shrink: true });
      break;
    case 'Shatter':
      for (const [dx, dy] of [[-1, 1], [1, 1], [-1, -1], [1, -1]]) {
        emit(list, { x: x + dx / 4, y: y + dy / 4, vx: dx * (3 + Math.random() * 3), vy: 6 + dy * 3, g: -40, life: 1, size: T / 2, color, spin: dx * 7, outline: true });
      }
      spray(list, 10, x, y, 5, { color: '#fff', size: 3, add: true });
      break;
    case 'Gash':
      for (const a of [Math.PI / 4, -Math.PI / 4]) emit(list, { x, y, slash: a, life: 0.6, color: '#ff1e3c', add: true });
      spray(list, 25, x, y, 9, { color: '#ff1e3c', add: true, shrink: true });
      break;
    case 'Pixelate': // the icon breaks into a 5x5 grid of pixels
      for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) {
        const ox = (i - 2) / 5, oy = (j - 2) / 5;
        emit(list, { x: x + ox, y: y + oy, vx: ox * 12 + (Math.random() - 0.5) * 3, vy: oy * 12 + 5 + Math.random() * 4, g: -35,
          life: 0.8 + Math.random() * 0.4, size: T / 5, color: (i * 3 + j) % 4 ? color : '#ffffff', spin: (Math.random() - 0.5) * 8 });
      }
      break;
    case 'Vortex': // sparks spiral in, then pop
      for (let i = 0; i < 40; i++) emit(list, { orbit: { x, y, r: 1.2 + Math.random() * 1.5, a: Math.random() * TAU, spin: 8 }, life: 0.5 + Math.random() * 0.2, size: 8, shrink: true, color: i % 3 ? color : '#ffffff', add: true });
      emit(list, { x, y, ring: -2, life: 0.6, color, add: true }); // a ring that closes in with them
      emit(list, { x, y, life: 0.62, size: 0, color, burst: 24 });
      break;
    case 'Fireworks': // three rockets that burst in the air
      ['#ff4f7a', '#4fd6ff', '#ffd400'].forEach((c, i) => emit(list, { x, y, vx: (i - 1) * 4, vy: 8 + i, g: -20, life: 0.36 + i * 0.05, size: 5, color: c, add: true, burst: 22 }));
      emit(list, { x, y, ring: 5, life: 0.3, color: '#fff', add: true });
      break;
    case 'Lightning':
      for (let i = 0; i < 6; i++) emit(list, { x, y, bolt: jag(i * TAU / 6 + Math.random() * 0.5, 1.6 + Math.random() * 0.8), life: 0.65, color: '#bfe6ff', add: true });
      emit(list, { x, y, ring: 9, life: 0.25, color: '#ffffff', add: true });
      spray(list, 12, x, y, 8, { color: '#bfe6ff', add: true, size: 3 });
      break;
    case 'Spirit': // a little ghost floats away
      emit(list, { x, y, vy: 2.4, life: 1.4, size: 30, shape: 'spirit', color: 'rgba(255,255,255,0.92)' });
      spray(list, 10, x, y, 4, { shape: 'sparkle', color: '#ffffff', size: 9, add: true });
      break;
  }
}

// Trails: particle trails spawn from here every frame; line and echo trails draw from the position history.
function emitTrail(list, x, y, name, color) {
  const r = Math.random;
  switch (name) {
    case 'Sparkle': if (r() < 0.35) emit(list, { x: x - 0.3, y: y + (r() - 0.5) * 0.8, vx: -1 - r(), vy: (r() - 0.5) * 1.5, life: 0.5, size: 7 + r() * 6, shape: 'sparkle', color: r() < 0.5 ? '#ffffff' : '#fff3a0', add: true, shrink: true }); break;
    case 'Fire': emit(list, { x: x - 0.35, y: y + (r() - 0.5) * 0.5, vx: -2 - r() * 2, vy: 1 + r() * 2, life: 0.3 + r() * 0.15, size: 12 + r() * 6, shape: 'blob', color: r() < 0.5 ? '#ff9a1f' : '#ff4a1f', add: true, shrink: true }); break;
    case 'Bubbles': if (r() < 0.2) emit(list, { x: x - 0.3, y: y + (r() - 0.5) * 0.6, vx: -1.5, vy: 1 + r(), life: 0.9, size: 6 + r() * 8, shape: 'circle', color: 'rgba(170,230,255,0.9)' }); break;
    case 'Pixels': if (r() < 0.5) emit(list, { x: x - 0.4, y: y + (r() - 0.5) * 0.7, vx: -2 - r() * 2, vy: r() * 2, g: -14, life: 0.6, size: 5, color: r() < 0.5 ? color : '#ffffff' }); break;
  }
}
function drawTrail(hist, name, toX, toY, scale, time, drawIcon) {
  if (name === 'Streak' || name === 'Rainbow') { // a tapered ribbon, drawn in short runs so it can thin out
    const pts = hist.slice(-21);
    ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
    for (let i = 0; i + 1 < pts.length; i += 4) {
      const k = (i + 4) / pts.length;
      ctx.strokeStyle = name === 'Rainbow' ? `hsla(${mod(time * 300 + i * 22, 360)},100%,62%,${0.25 + k * 0.7})` : `rgba(255,255,255,${k * 0.75})`;
      ctx.lineWidth = (2 + k * 9) * scale;
      ctx.beginPath(); pts.slice(i, i + 5).forEach((q, j) => ctx[j ? 'lineTo' : 'moveTo'](toX(q), toY(q))); ctx.stroke();
    }
  } else if (name === 'Echo') { // fading afterimages
    for (const k of [18, 12, 6]) {
      const q = hist[hist.length - 1 - k];
      if (!q) continue;
      ctx.globalAlpha = 0.5 - k / 50; drawIcon(q, toX(q), toY(q));
    }
    ctx.globalAlpha = 1;
  }
}
function drawWaveTrail(hist, toX, toY, color, scale = 1) { // the wave's solid zigzag line, fading toward its tail
  let i = hist.length - 1;
  while (i > 0 && hist[i - 1].mode === 'wave') i--;
  const pts = hist.slice(i);
  if (pts.length < 2) return;
  const x0 = toX(pts[0]), x1 = toX(pts[pts.length - 1]), fade = c => { const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, alpha(c, 0)); g.addColorStop(1, alpha(c, 1)); return g; };
  ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
  ctx.beginPath(); pts.forEach((q, j) => ctx[j ? 'lineTo' : 'moveTo'](toX(q), toY(q)));
  ctx.shadowColor = color; ctx.shadowBlur = 12; ctx.strokeStyle = fade(color); ctx.lineWidth = 10 * scale; ctx.stroke();
  ctx.shadowBlur = 0; ctx.strokeStyle = fade('#ffffff'); ctx.lineWidth = 3.5 * scale; ctx.stroke();
}

function burstAt(x, y, color, n = 10) {
  emit(particles, { x, y, ring: 5, life: 0.35, color, add: true });
  spray(particles, n, x, y, 6, { color, add: true, shrink: true, size: 5 });
}

// Cosmetic effects for what happened during the last physics step.
function playEffects(prev) {
  const p = player, color = mainColor(skin(p.mode));
  if (p.mode === 'cube') {
    if (prev.grounded && !p.grounded && p.vy > 0) {
      spray(particles, 6, p.x + 0.5, p.y + 0.05, 3, { color: 'rgba(255,255,255,0.7)', size: 4, life: 0.3, g: -10 });
      if (++save.jumps >= 1000) unlockSecret('jumps');
    } else if (!prev.grounded && p.grounded) spray(particles, 8, p.x + 0.5, p.y + 0.05, 4, { color: 'rgba(255,255,255,0.6)', size: 4, life: 0.25 });
    if (p.grounded && Math.random() < 0.7) emit(particles, { x: p.x + 0.05, y: p.y + 0.08, vx: -3 - Math.random() * 2, vy: 0.5 + Math.random() * 1.5, life: 0.35, size: 5, color, shrink: true, add: true });
  } else if (p.mode === 'ship') {
    emit(particles, { x: p.x - 0.05, y: p.y + 0.38, vx: -9 + Math.random() * 3, vy: (Math.random() - 0.5) * 2, life: 0.22, size: 8, color: holding ? '#ffc34d' : '#ff7a1a', add: true, shrink: true });
    if (Math.random() < 0.35) emit(particles, { x: p.x - 0.1, y: p.y + 0.38, vx: -5, vy: (Math.random() - 0.3) * 1.5, life: 0.7, size: 10, color: 'rgba(210,210,230,0.25)', shrink: true });
  } else if (p.mode === 'ball') {
    const contact = p.y + (p.grav > 0 ? 0.05 : 0.95);
    if (p.grav !== prev.grav) spray(particles, 8, p.x + 0.5, p.y + (p.grav > 0 ? 0.95 : 0.05), 4, { color: 'rgba(255,255,255,0.7)', size: 4, life: 0.3 });
    if (p.grounded && Math.random() < 0.6) emit(particles, { x: p.x + 0.2, y: contact, vx: -3 - Math.random() * 2, vy: p.grav * (0.5 + Math.random()), life: 0.3, size: 4, color, shrink: true, add: true });
  }
  emitTrail(particles, p.x + 0.5, p.y + 0.5, skin('trail').name, color);
  if (p.used.length > prev.used) { const o = level.tiles[p.used[p.used.length - 1]]; burstAt(o.x + 0.5, o.y + 0.5, '#ffd400'); }
  if (p.vy === PAD && prev.vy !== PAD) burstAt(p.x + 0.5, p.y + 0.1, '#ffd400');
  if (p.coins.length > prev.coins) { const c = level.tiles[p.coins[p.coins.length - 1]]; burstAt(c.x + 0.5, c.y + 0.5, '#ffcc33', 18); }
  if (p.mode !== prev.mode) burstAt(p.x + 0.5, p.y + 0.5, MODE_COLOR[p.mode], 16);
}

function finishLevel() {
  const firstClear = !beaten(selected);
  const had = save.coins[selected] || [];
  const coins = [...new Set([...had, ...player.coins])];
  save.best[selected] = 100; save.coins[selected] = coins; persist();
  const notes = [];
  if (firstClear) notes.push(`+${level.stars} ★`);
  if (coins.length > had.length) notes.push(`+${coins.length - had.length} ◉`);
  const got = firstClear ? KINDS.flatMap(k => ITEMS[k].filter(it => it.level === selected).map(it => it.name)) : [];
  if (got.length) notes.push(`Unlocked ${got.join(' & ')}!`);
  winNote = notes.join('   ');
  const camX = player.x - PLAYER_SCREEN_X;
  for (const side of [-1, 1]) {
    for (let i = 0; i < 45; i++) {
      emit(particles, { x: camX + (side < 0 ? 1 : W / T - 1), y: 0.3, vx: -side * (3 + Math.random() * 7), vy: 12 + Math.random() * 9, g: -22,
        life: 1.6 + Math.random() * 0.6, size: 7, spin: (Math.random() - 0.5) * 16, color: `hsl(${Math.random() * 360},90%,60%)` });
    }
  }
}

function die() {
  const pct = progress();
  save.best[selected] = Math.max(save.best[selected] || 0, pct);
  save.deaths++; persist();
  if (save.deaths >= 50) unlockSecret('deaths');
  if (pct >= 90) unlockSecret('close');
  deathEffect(particles, player.x + 0.5, player.y + 0.5, skin('death').name, mainColor(skin(player.mode)));
  if (!REDUCED_MOTION) shake = 0.35;
}

// ---- Color and shape helpers ----
const solid = c => c.slice(0, 7);
function shade(hex, amt) { // amt > 0 mixes toward white, < 0 toward black; keeps the hex's alpha
  const n = parseInt(hex.slice(1, 7), 16), a = hex.length > 7 ? parseInt(hex.slice(7, 9), 16) / 255 : 1;
  const mix = c => Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt);
  return `rgba(${mix(n >> 16)},${mix((n >> 8) & 255)},${mix(n & 255)},${a.toFixed(3)})`;
}
function alpha(hex, a) { const n = parseInt(hex.slice(1, 7), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const GLITCH = ['#ff2d6f', '#2dffe0', '#ffe02d', '#8a2dff'];
const bodyColor = s => s.body === 'glitch' ? GLITCH[Math.floor(performance.now() / 90) % GLITCH.length] : s.body;
const mainColor = s => { // the color for a skin's effects: its body, or its inner color when the body is too dark to glow
  const c = solid(bodyColor(s)), n = parseInt(c.slice(1), 16);
  return (n >> 16) * 0.3 + ((n >> 8) & 255) * 0.59 + (n & 255) * 0.11 > 60 ? c : solid(s.inner);
};
const MODE_COLOR = { ship: '#ff4fd8', cube: '#4fff7a', ball: '#ff7a2b', wave: '#3fd0ff' }; // also each mode's portal color
const FACE = { Easy: '#3ddc4a', Normal: '#2fa4ff', Hard: '#ff8a1f', Insane: '#d63cff', Demon: '#e8212b' };

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function vgrad(y0, y1, ...stops) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
  return g;
}
function txt(s, x, y, size, fill = '#fff', align = 'center', stroke = 0) { // display font, optional black outline
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function ui(s, x, y, size, fill = '#fff', align = 'center') { // small readable UI text
  ctx.font = `600 ${size}px system-ui, sans-serif`; ctx.textAlign = align;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function poly(pts, fill, lw = 2.5) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  if (lw) { ctx.lineJoin = 'round'; ctx.strokeStyle = '#000'; ctx.lineWidth = lw; ctx.stroke(); }
}
function box(x, y, w, h, fill, lw = 2.5) {
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
  if (lw) { ctx.strokeStyle = '#000'; ctx.lineWidth = lw; ctx.strokeRect(x, y, w, h); }
}
function starPath(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? r * 0.45 : r;
    ctx.lineTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d);
  }
  ctx.closePath();
}
function drawStar(cx, cy, r, fill = '#ffd400') {
  starPath(cx, cy, r); ctx.fillStyle = fill; ctx.fill();
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(1.5, r / 5); ctx.stroke();
}
function drawCoinIcon(cx, cy, r, kind) { // kind: 'new' gold, 'old' silver (collected before), 'none' empty slot
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
  if (kind === 'none') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5; ctx.stroke();
    return;
  }
  const [hi, mid, lo] = kind === 'old' ? ['#eef2ff', '#a9b6e8', '#5b68a6'] : ['#fff6c0', '#ffcc33', '#b27300'];
  const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
  g.addColorStop(0, hi); g.addColorStop(0.55, mid); g.addColorStop(1, lo);
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.58, 0, TAU); ctx.strokeStyle = lo; ctx.lineWidth = Math.max(1, r * 0.14); ctx.stroke();
}
function sparkle(x, y, r, color = '#fff') {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill();
}

// ---- Icons ----
// Cube patterns, drawn in a 40x40 box centred on 0,0.
const LOOKS = {
  classic(body, inner) { box(-10, -10, 20, 20, inner); box(-4, -4, 8, 8, body, 2); },
  face(body, inner) {
    box(-12, -10, 8, 9, inner); box(4, -10, 8, 9, inner); box(-11, 5, 22, 6, inner);
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(-10.5, -8.5, 3, 3); ctx.fillRect(5.5, -8.5, 3, 3); // eye shine
  },
  diamond(body, inner) {
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) poly([[sx * 18, sy * 18], [sx * 8, sy * 18], [sx * 18, sy * 8]], inner, 2);
    poly([[0, -13], [13, 0], [0, 13], [-13, 0]], inner);
    poly([[0, -6], [6, 0], [0, 6], [-6, 0]], body, 2);
  },
  flame(body, inner) {
    poly([[-13, 3], [0, -13], [13, 3], [13, 11], [0, -3], [-13, 11]], inner);
    poly([[-8, 15], [0, 7], [8, 15]], inner, 2);
  },
  core(body, inner, t) {
    const r = 10 + Math.sin(t * 5) * 1.5;
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, r + 5);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, inner); g.addColorStop(1, alpha(inner, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r + 5, 0, TAU); ctx.fill();
    ctx.strokeStyle = inner; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.stroke();
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) box(sx * 15 - 2.5, sy * 15 - 2.5, 5, 5, inner, 1.5);
  },
  crown(body, inner) {
    starPath(0, 2, 12); ctx.fillStyle = inner; ctx.fill();
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = shade(body, -0.4);
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { ctx.beginPath(); ctx.arc(sx * 13, sy * 13, 2.5, 0, TAU); ctx.fill(); }
  },
  glitch(body, inner, t) {
    const j = Math.floor(t * 12), off = (j % 3) - 1;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,0,80,0.8)'; ctx.fillRect(-10 + off * 3, -10, 20, 20);
    ctx.fillStyle = 'rgba(0,255,220,0.8)'; ctx.fillRect(-10 - off * 3, -10, 20, 20);
    ctx.globalCompositeOperation = 'source-over';
    box(-6, -6, 12, 12, inner, 0);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 3; i++) ctx.fillRect(-20, ((j * 7 + i * 13) % 36) - 18, 40, 2);
  },
  ninja(body, inner, t) {
    const flap = Math.sin(t * 10) * 2;
    poly([[13, -13], [24, -19 + flap], [21, -9]], inner, 2); poly([[13, -10], [23, -4 + flap], [17, -4]], inner, 2); // headband tails
    box(-20, -15, 40, 7, inner, 2);
    box(-16, -2, 32, 11, '#f2d3a8', 2); // the eye slit
    poly([[-12, 1], [-3, 3.5], [-11, 6]], '#000', 0); poly([[12, 1], [3, 3.5], [11, 6]], '#000', 0);
  },
  robot(body, inner, t) {
    box(-14, -10, 28, 12, '#14171f', 2); // visor with a scanning eye
    ctx.fillStyle = inner; ctx.shadowColor = inner; ctx.shadowBlur = 10;
    ctx.fillRect(Math.sin(t * 2.5) * 7 - 5, -6, 10, 4); ctx.shadowBlur = 0;
    for (const x of [-9, -3, 3, 9]) box(x - 1.5, 7, 3, 7, shade(body, -0.45), 0); // mouth grille
    ctx.fillStyle = shade(body, -0.5);
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { ctx.beginPath(); ctx.arc(sx * 14, sy * 14, 1.8, 0, TAU); ctx.fill(); }
  },
  checker(body, inner) {
    ctx.fillStyle = inner;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) if ((i + j) % 2) ctx.fillRect(-16 + i * 8, -16 + j * 8, 8, 8);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(-16, -16, 32, 32);
  },
  bolt(body, inner) { poly([[3, -16], [-9, 2], [-1, 2], [-4, 16], [9, -3], [1, -3]], inner, 2.5); },
  skull(body, inner) {
    ctx.fillStyle = inner;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 7.5, -4, 5.5, 6.5, 0, 0, TAU); ctx.fill(); }
    poly([[0, 3], [-3, 8], [3, 8]], inner, 0);
    ctx.fillStyle = '#ff2a2a'; for (const s of [-1, 1]) ctx.fillRect(s * 7.5 - 1, -3, 2, 2); // a glint in each socket
    ctx.strokeStyle = inner; ctx.lineWidth = 1.5; ctx.strokeRect(-9, 10, 18, 6);
    ctx.beginPath(); for (const x of [-4.5, 0, 4.5]) { ctx.moveTo(x, 10); ctx.lineTo(x, 16); } ctx.stroke(); // teeth
  },
  heart(body, inner, t) {
    const k = 1 + Math.max(0, Math.sin(t * 7)) ** 4 * 0.12; // heartbeat
    ctx.save(); ctx.scale(k, k);
    ctx.beginPath(); ctx.moveTo(0, 13); ctx.bezierCurveTo(-19, 0, -11, -16, 0, -6); ctx.bezierCurveTo(11, -16, 19, 0, 0, 13);
    ctx.fillStyle = inner; ctx.fill(); ctx.lineJoin = 'round'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.65)'; ctx.beginPath(); ctx.ellipse(-7, -4, 3, 1.8, -0.7, 0, TAU); ctx.fill();
    ctx.restore();
  },
  circuit(body, inner, t) {
    ctx.strokeStyle = inner; ctx.fillStyle = inner; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.shadowColor = inner; ctx.shadowBlur = 6;
    for (const pts of [[[-20, -8], [-9, -8], [-4, -13], [7, -13]], [[20, 5], [9, 5], [4, 10], [-7, 10]], [[-20, 9], [-13, 9], [-13, 16]], [[20, -9], [13, -9], [13, -16]]]) {
      ctx.beginPath(); pts.forEach(([x, y], i) => ctx[i ? 'lineTo' : 'moveTo'](x, y)); ctx.stroke();
      const [x, y] = pts[pts.length - 1]; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, TAU); ctx.fill();
    }
    ctx.shadowBlur = 0;
    box(-6, -5, 12, 10, '#0a0f0d', 2); // the chip, with a blinking light
    ctx.fillStyle = mod(t, 1) < 0.5 ? inner : shade(inner, -0.5); ctx.fillRect(-2, -1.5, 4, 3);
  },
  moon(body, inner) {
    ctx.beginPath(); ctx.arc(-3, 2, 12, 0.28, 4.61); ctx.arc(3, -3, 10, 3.91, 0.99, true); ctx.closePath(); // a crescent
    ctx.fillStyle = inner; ctx.fill(); ctx.lineJoin = 'round'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.stroke();
    sparkle(10, -10, 4.5); sparkle(13, 10, 3); sparkle(4, 3, 2.5);
  },
  cat(body, inner) {
    for (const s of [-1, 1]) { poly([[s * 18, -17], [s * 15, -27], [s * 6, -17]], body, 2.5); poly([[s * 15.5, -18], [s * 14, -23.5], [s * 9.5, -18]], '#ff9ab8', 0); } // ears
    for (const s of [-1, 1]) {
      ctx.fillStyle = inner; ctx.beginPath(); ctx.ellipse(s * 7, -3, 3.2, 4.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(s * 7 - 1, -6, 1.6, 1.6);
    }
    poly([[-2.5, 3], [2.5, 3], [0, 5.5]], '#ff7aa8', 1.5); // nose
    ctx.strokeStyle = inner; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.moveTo(0, 5.5); ctx.quadraticCurveTo(-3, 9, -6, 7); ctx.moveTo(0, 5.5); ctx.quadraticCurveTo(3, 9, 6, 7); // mouth
    for (const s of [-1, 1]) for (const d of [-1.5, 1.5]) { ctx.moveTo(s * 10, 5 + d); ctx.lineTo(s * 18, 4 + d * 2); } // whiskers
    ctx.stroke(); ctx.lineCap = 'butt';
  },
};

function drawCube(cx, cy, rot, s, size = T, glow = false) {
  const body = bodyColor(s), h = T / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(size / T, size / T);
  if (glow) { ctx.shadowColor = alpha(solid(body), 0.75); ctx.shadowBlur = 16; }
  const g = ctx.createLinearGradient(-h, -h, h, h);
  g.addColorStop(0, shade(body, 0.35)); g.addColorStop(0.55, body); g.addColorStop(1, shade(body, -0.35));
  ctx.fillStyle = g; ctx.fillRect(-h, -h, T, T);
  ctx.shadowBlur = 0;
  LOOKS[s.look](body, s.inner, performance.now() / 1000);
  ctx.lineWidth = 2; // bevel: lit top-left edge, shaded bottom-right edge
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.moveTo(-h + 4.5, h - 7); ctx.lineTo(-h + 4.5, -h + 4.5); ctx.lineTo(h - 7, -h + 4.5); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.moveTo(h - 4.5, -h + 7); ctx.lineTo(h - 4.5, h - 4.5); ctx.lineTo(-h + 7, h - 4.5); ctx.stroke();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeRect(-h + 1.5, -h + 1.5, T - 3, T - 3);
  ctx.restore();
}

// Ship hulls, drawn around the pilot cube with the exhaust at the back (x -27, y 6.5). The first shape gets the glow.
const SHIPS = {
  rocket(body, inner) {
    poly([[-24, 0], [-8, -4], [12, -4], [24, 7], [10, 13], [-18, 13], [-24, 7]], vgrad(-4, 13, shade(body, 0.4), body, shade(body, -0.35)), 3);
    ctx.shadowBlur = 0;
    poly([[-22, 1], [-29, -10], [-13, -3]], shade(body, -0.15), 2.5); // tail fin
    box(-28, 2.5, 5, 8, vgrad(2.5, 10.5, '#777', '#222'), 2); // exhaust nozzle
    box(-17, 6, 30, 3.5, inner, 1.5); // trim stripe
    for (const rx of [-12, -4, 4]) { ctx.fillStyle = shade(body, -0.45); ctx.fillRect(rx - 1, 1.5, 2, 2); } // rivets
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-6, -1); ctx.lineTo(11, -1); ctx.stroke();
  },
  jet(body, inner) {
    poly([[-26, 1], [-12, -3], [6, -3], [27, 5], [8, 11], [-26, 11]], vgrad(-3, 11, shade(body, 0.4), body, shade(body, -0.35)), 3);
    ctx.shadowBlur = 0;
    poly([[-24, 1], [-30, -12], [-21, -12], [-14, -2]], shade(body, -0.2), 2.5); // tail fin
    poly([[-8, 7], [-18, 17], [-9, 17], [6, 7]], shade(body, -0.3), 2.5); // swept wing
    box(-29, 3, 4, 7, vgrad(3, 10, '#777', '#222'), 2); // nozzle
    ctx.strokeStyle = inner; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-22, 5); ctx.lineTo(17, 5); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-3, -3, 11, 12, 0, Math.PI, TAU); ctx.closePath(); // glass canopy over the pilot
    ctx.fillStyle = alpha(inner, 0.3); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(-3, -3, 7, 8, 0, Math.PI * 1.2, Math.PI * 1.5); ctx.stroke();
  },
  shark(body, inner, t) {
    poly([[-23, 2], [-8, -3], [10, -2], [26, 6], [12, 13], [-10, 13], [-23, 9]], vgrad(-3, 13, shade(body, 0.35), body, shade(body, -0.3)), 3);
    ctx.shadowBlur = 0;
    const wag = Math.sin(t * 8) * 2;
    poly([[-21, 5], [-31, -7 + wag], [-27, 5.5], [-31, 17 + wag]], shade(body, -0.15), 2.5); // tail
    poly([[-21, 1], [-18, -11], [-13, -1]], shade(body, -0.1), 2.5); // dorsal fin
    poly([[-10, 8.5], [12, 8.5], [20, 8], [12, 11], [-10, 11]], inner, 0); // belly
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(15, 3, 2, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(15, 1.8, 1, 1);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (const x of [5, 7.5, 10]) { ctx.moveTo(x, 1); ctx.lineTo(x - 1, 6); } // gills
    ctx.moveTo(17, 8.5); ctx.lineTo(25, 7); ctx.stroke();
    for (const x of [18, 20.5, 23]) poly([[x, 8.3], [x + 1, 10], [x + 2, 7.8]], '#fff', 0); // teeth
  },
  bat(body, inner, t) {
    ctx.beginPath(); ctx.ellipse(-2, 6, 18, 7.5, 0, 0, TAU);
    ctx.fillStyle = vgrad(-1.5, 13.5, shade(body, 0.4), body, shade(body, -0.35)); ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
    poly([[11, -1], [12, -12], [16, -3]], body, 2); poly([[16, -3], [20, -12], [21, 0]], body, 2); // ears
    ctx.beginPath(); ctx.arc(16, 2, 7, 0, TAU); ctx.fillStyle = body; ctx.fill(); ctx.stroke(); // head
    ctx.fillStyle = inner; ctx.fillRect(18, -0.5, 3, 2.5);
    poly([[18.5, 6.5], [19.5, 9.5], [20.5, 6.5]], '#fff', 0);
    ctx.save(); ctx.translate(-4, 3); ctx.rotate(Math.sin(t * 12) * 0.45); // the near wing flaps
    poly([[4, 0], [-6, -14], [-12, -8], [-18, -12], [-22, -4], [-27, -6], [-24, 4], [2, 5]], shade(body, -0.25), 2.5);
    ctx.strokeStyle = alpha(inner, 0.6); ctx.lineWidth = 1.2; ctx.beginPath();
    for (const [x, y] of [[-6, -14], [-18, -12], [-27, -6]]) { ctx.moveTo(2, 1); ctx.lineTo(x, y); }
    ctx.stroke(); ctx.restore();
  },
  saucer(body, inner, t) {
    ctx.beginPath(); ctx.ellipse(-2, 7, 26, 7.5, 0, 0, TAU);
    ctx.fillStyle = vgrad(-0.5, 14.5, shade(body, 0.45), body, shade(body, -0.4)); ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-3, 2, 12, 14, 0, Math.PI, TAU); ctx.closePath(); // glass dome
    ctx.fillStyle = alpha(inner, 0.35); ctx.fill(); ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(-3, 2, 8, 10, 0, Math.PI * 1.15, Math.PI * 1.45); ctx.stroke();
    for (let i = 0; i < 5; i++) { // chasing rim lights
      const on = Math.floor(t * 6) % 5 === i;
      ctx.fillStyle = on ? '#ffffff' : '#ffd400'; ctx.beginPath(); ctx.arc(-18 + i * 8, 8.5, on ? 2.6 : 2, 0, TAU); ctx.fill();
    }
  },
  duck(body, inner) {
    ctx.beginPath(); ctx.ellipse(-3, 6, 20, 8, 0, 0, TAU);
    ctx.fillStyle = vgrad(-2, 14, shade(body, 0.45), body, shade(body, -0.3)); ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
    poly([[-19, 3], [-28, -5], [-16, -1]], body, 2.5); // tail
    ctx.beginPath(); ctx.arc(13, -5, 8.5, 0, TAU); ctx.fillStyle = body; ctx.fill(); ctx.lineWidth = 2.5; ctx.stroke(); // head
    poly([[19.5, -6.5], [28, -3.5], [19.5, -0.5]], inner, 2); // beak
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(15, -7, 1.8, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(15, -8.3, 1, 1);
    ctx.save(); ctx.translate(-5, 6); ctx.rotate(-0.2); // wing
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 4.5, 0, 0, TAU); ctx.fillStyle = shade(body, -0.15); ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  },
};
const PILOT = { jet: [-3, -6, 16], bat: [-2, -8, 18], saucer: [-3, -4, 15], duck: [-6, -7, 17] }; // where a hull seats the cube

function drawShip(cx, cy, rot, s, size = T, glow = false) {
  const body = s.body, [px, py, ps] = PILOT[s.look] || [-3, -9, 20];
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(size / T, size / T);
  drawCube(px, py, 0, skin('cube'), ps); // the pilot, half hidden by the hull
  if (glow) { ctx.shadowColor = alpha(solid(body), 0.75); ctx.shadowBlur = 14; }
  SHIPS[s.look](body, s.inner, performance.now() / 1000);
  ctx.restore();
}

function drawFlame(cx, cy, rot, strong) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  const L = (strong ? 26 : 14) + Math.random() * 8, bx = -27, by = 6.5;
  const g = ctx.createLinearGradient(bx, 0, bx - L, 0);
  g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.3, 'rgba(255,212,0,0.9)');
  g.addColorStop(0.7, 'rgba(255,90,0,0.6)'); g.addColorStop(1, 'rgba(255,60,0,0)');
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(bx, by - 6);
  ctx.quadraticCurveTo(bx - L * 0.5, by - 7, bx - L, by); ctx.quadraticCurveTo(bx - L * 0.5, by + 7, bx, by + 6);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// Ball patterns, drawn rotated and clipped inside the ball (radius 18; the saw's teeth reach 20).
const BALLS = {
  spokes(body, inner) {
    ctx.fillStyle = shade(body, -0.35);
    for (let i = 0; i < 12; i++) { ctx.save(); ctx.rotate(i * TAU / 12); ctx.fillRect(-1.5, -18, 3, 3.5); ctx.restore(); } // tread
    ctx.beginPath(); ctx.arc(0, 0, 11.5, 0, TAU); ctx.fillStyle = inner; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.stroke();
    for (let i = 0; i < 4; i++) { ctx.save(); ctx.rotate(i * Math.PI / 2); box(-2, -11.5, 4, 11.5, body, 2); ctx.restore(); }

function drawFace(cx, cy, r, d) { // difficulty face

  if (horns) for (const s of [-1, 1]) poly([[cx + s * r * 0.4, cy - r * 0.75], [cx + s * r * 0.85 * big, cy - r * 1.3 * big], [cx + s * r * 0.85, cy - r * 0.45]], shade(c, -0.35), 2);

  else if (d === 'Insane') [-0.36, -0.18, 0, 0.18, 0.36].forEach((k, i) => ctx.lineTo(cx + k * r, cy + r * (i % 2 ? 0.3 : 0.45)));
  else { // Demon: an open grin with fangs
    ctx.moveTo(cx - r * 0.45, cy + r * 0.28); ctx.quadraticCurveTo(cx, cy + r * 0.85, cx + r * 0.45, cy + r * 0.28); ctx.closePath();
    ctx.fillStyle = '#2a0000'; ctx.fill();
  }
  ctx.stroke();
  if (d === 'Demon') for (const s of [-1, 1]) poly([[cx + s * r * 0.3, cy + r * 0.31], [cx + s * r * 0.2, cy + r * 0.52], [cx + s * r * 0.1, cy + r * 0.34]], '#fff', 1.5);

  }
  ctx.restore();

})();
const VIGNETTE = (() => {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, W * 0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.42)');
  return g;
})();

function drawBackground(hue, camX, time) {
  ctx.fillStyle = vgrad(0, GROUND, `hsl(${hue},75%,36%)`, `hsl(${hue},70%,17%)`);
  ctx.fillRect(0, 0, W, H);
  const S = 160; // far layer: a big faint grid of rounded tiles that barely moves
  ctx.lineWidth = 2; ctx.fillStyle = `hsla(${hue},90%,70%,0.05)`; ctx.strokeStyle = `hsla(${hue},90%,80%,0.08)`;
  for (let x = -mod(camX * T * 0.08, S); x < W; x += S) {
    for (let y = -40; y < GROUND; y += S) { rr(x + 10, y + 10, S - 20, S - 20, 14); ctx.fill(); ctx.stroke(); }
  }
  for (let i = 0; i < 9; i++) { // near layer: drifting squares
    const s = 26 + (i * 23) % 50, px = mod(i * 237 - camX * T * 0.3, W + 200) - 100, py = 40 + (i * 89) % (GROUND - 140);
    ctx.save(); ctx.translate(px, py); ctx.rotate(time * 0.25 * (i % 2 ? 1 : -1) + i);
    ctx.fillStyle = `hsla(${hue},90%,75%,0.08)`; ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.strokeStyle = `hsla(${hue},90%,85%,0.14)`; ctx.strokeRect(-s / 2, -s / 2, s, s);
    ctx.restore();
  }
  const P = 150, off = camX * T * 0.2; // a range of dark peaks along the horizon
  ctx.fillStyle = `hsla(${hue},70%,8%,0.4)`; ctx.strokeStyle = `hsla(${hue},90%,75%,0.16)`; ctx.lineJoin = 'round';
  for (let k = Math.floor(off / P) - 2; k * P - off < W + 2 * P; k++) {
    const x = k * P - off, h = 60 + mod(k * 137, 5) * 26, w = 90 + mod(k * 71, 3) * 35;
    ctx.beginPath(); ctx.moveTo(x - w, GROUND); ctx.lineTo(x, GROUND - h); ctx.lineTo(x + w, GROUND); ctx.fill(); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter'; // floating motes
  for (let i = 0; i < 24; i++) {
    const x = mod(i * 211 - camX * T * (0.3 + (i % 4) * 0.15), W + 40) - 20, y = mod(i * 67 - time * (6 + (i % 5) * 4), GROUND + 20) - 10, s = 1.5 + (i % 3);
    ctx.fillStyle = `hsla(${hue},100%,85%,${0.15 + (i % 4) * 0.08})`; ctx.fillRect(x, y, s, s);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawFloor(hue, camX, lineY, up) { // ground, or the ceiling in ship mode when up is true
  const y0 = up ? 0 : lineY, h = up ? lineY : H - lineY;
  if (h <= 0) return;
  ctx.fillStyle = vgrad(lineY, up ? lineY - 80 : lineY + 80, `hsl(${hue},70%,22%)`, `hsl(${hue},70%,8%)`);
  ctx.fillRect(0, y0, W, h);
  ctx.strokeStyle = `hsla(${hue},90%,75%,0.16)`; ctx.lineWidth = 2;
  const S = 2 * T;
  for (let x = -mod(camX * T, S); x < W; x += S) ctx.strokeRect(x + 2, up ? lineY - S + 2 : lineY + 3, S - 4, S - 4);
  ctx.fillStyle = vgrad(lineY, up ? lineY - 22 : lineY + 22, `hsla(${hue},100%,75%,0.22)`, `hsla(${hue},100%,75%,0)`); // sheen under the edge
  ctx.fillRect(0, up ? lineY - 22 : lineY, W, 22);
  ctx.fillStyle = EDGE;
  ctx.globalAlpha = 0.3; ctx.fillRect(0, lineY - 3, W, 6);
  ctx.globalAlpha = 1; ctx.fillRect(0, lineY - 1, W, 2);
}

function drawBlocks(blocks, sx, sy, hue) {
  if (!blocks.length) return;
  const fill = vgrad(0, T, `hsl(${hue},45%,17%)`, `hsl(${hue},60%,5%)`);
  const glow = Object.entries({ top: [0, 0, 0, 1], bottom: [0, T, 0, T - 1], left: [0, 0, 1, 0], right: [T, 0, T - 1, 0] }).map(([side, [x0, y0, x1, y1]]) => {
    const g = ctx.createLinearGradient(x0, y0, x0 + (x1 - x0) * 14, y0 + (y1 - y0) * 14); // inner neon glow along exposed edges
    g.addColorStop(0, `hsla(${hue},100%,72%,0.3)`); g.addColorStop(1, `hsla(${hue},100%,72%,0)`);
    return [side, g];
  });
  ctx.lineWidth = 2; ctx.strokeStyle = `hsla(${hue},80%,80%,0.13)`;
  for (const t of blocks) {
    const x = sx(t.x), y = sy(t.y + 1);
    ctx.translate(x, y);
    ctx.fillStyle = fill; ctx.fillRect(0, 0, T, T);
    for (const [side, g] of glow) if (t.open[side]) { ctx.fillStyle = g; ctx.fillRect(0, 0, T, T); }
    ctx.strokeRect(7, 7, T - 14, T - 14);
    ctx.translate(-x, -y);
  }
  ctx.beginPath(); // outline only exposed edges: a wide glow pass, then a crisp white pass
  for (const t of blocks) {
    const x = sx(t.x), y = sy(t.y + 1), o = t.open;
    if (o.top) { ctx.moveTo(x, y); ctx.lineTo(x + T, y); }
    if (o.bottom) { ctx.moveTo(x, y + T); ctx.lineTo(x + T, y + T); }
    if (o.left) { ctx.moveTo(x, y); ctx.lineTo(x, y + T); }
    if (o.right) { ctx.moveTo(x + T, y); ctx.lineTo(x + T, y + T); }
  }
  ctx.lineCap = 'square';
  ctx.strokeStyle = `hsla(${hue},100%,75%,0.35)`; ctx.lineWidth = 7; ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.lineCap = 'butt';
}

function drawSpike(x, y, down, hue, fill) {
  ctx.save();
  if (down) { ctx.translate(x, y + T); ctx.scale(1, -1); } else ctx.translate(x, y);
  ctx.beginPath(); ctx.moveTo(3, T); ctx.lineTo(T / 2, 3); ctx.lineTo(T - 3, T); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineJoin = 'round';
  ctx.strokeStyle = `hsla(${hue},100%,75%,0.35)`; ctx.lineWidth = 6; ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(11, T - 4); ctx.lineTo(T / 2, 14); ctx.lineTo(T - 11, T - 4);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

function drawPad(x, y, time) {
  const cx = x + T / 2, base = y + T;
  for (let i = 0; i < 3; i++) { // sparks rising off the pad
    const k = mod(time * 1.4 + i / 3, 1);
    ctx.fillStyle = `rgba(255,220,60,${(1 - k) * 0.8})`;
    ctx.fillRect(cx - 14 + i * 12, base - 8 - k * 34, 4, 4);
  }
  ctx.save();
  ctx.shadowColor = '#ffd400'; ctx.shadowBlur = 14;
  ctx.fillStyle = vgrad(base - 11, base, '#fff6a8', '#ffd400', '#ff9d00');
  ctx.beginPath(); ctx.ellipse(cx, base - 1, T * 0.42, 10, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function drawOrb(x, y, used, time) {
  const cx = x + T / 2, cy = y + T / 2;
  ctx.save();
  if (!used) {
    const k = mod(time * 1.2, 1);
    ctx.strokeStyle = `rgba(255,212,0,${0.7 * (1 - k)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, T * (0.36 + k * 0.3), 0, TAU); ctx.stroke();
    ctx.shadowColor = '#ffd400'; ctx.shadowBlur = 18;
  } else ctx.globalAlpha = 0.35;
  const g = ctx.createRadialGradient(cx - 4, cy - 5, 1, cx, cy, T * 0.33);
  g.addColorStop(0, '#fffbe6'); g.addColorStop(0.45, '#ffd400'); g.addColorStop(1, '#ff8f00');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, T * 0.32, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, T * 0.17, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawCoin(x, y, banked, time) {
  const cx = x + T / 2, cy = y + T / 2 + Math.sin(time * 3) * 3, spin = Math.max(0.12, Math.abs(Math.cos(time * 2.2)));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(spin, 1);
  ctx.shadowColor = banked ? '#a9b6e8' : '#ffcc33'; ctx.shadowBlur = 16;
  drawCoinIcon(0, 0, T * 0.38, banked ? 'old' : 'new');
  ctx.shadowBlur = 0;
  drawStar(0, 1, T * 0.15, banked ? '#d7defa' : '#ffe680');
  ctx.restore();
  const tw = mod(time * 0.8, 1);
  if (tw < 0.3) sparkle(cx + 11, cy - 13, Math.sin(tw / 0.3 * Math.PI) * 7);
}

// Portals draw in two halves so the player appears to pass through them: the back half (glow, swirling
// membrane, fins, left arc) before the player, then the front arc and the end caps over it.
function drawPortal(t, x, y, front, time) {
  const color = MODE_COLOR[PORTAL_MODE[t.type]], h = t.tall * T, cx = x + T / 2, cy = y + h / 2, rx = T * 0.6, ry = h / 2 - 4;
  const ellipse = (ax, ay, a0 = 0, a1 = TAU) => { ctx.beginPath(); ctx.ellipse(cx, cy, ax, ay, 0, a0, a1); };
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (!front) {
    ctx.globalCompositeOperation = 'lighter';
    const top = GROUND - ROWS * T; // a faint beam through the whole column, since a portal works at any height
    ctx.save(); ctx.translate(cx, (top + GROUND) / 2); ctx.scale(1, (GROUND - top) / T);
    const beam = ctx.createRadialGradient(0, 0, 0, 0, 0, T / 2);
    beam.addColorStop(0, alpha(color, 0.16)); beam.addColorStop(0.6, alpha(color, 0.08)); beam.addColorStop(1, alpha(color, 0));
    ctx.fillStyle = beam; ctx.fillRect(-T / 2, -T / 2, T, T);
    ctx.restore();
    ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry / rx); // soft halo
    const halo = ctx.createRadialGradient(0, 0, rx * 0.3, 0, 0, rx * 1.7);
    halo.addColorStop(0, alpha(color, 0.3)); halo.addColorStop(1, alpha(color, 0));
    ctx.fillStyle = halo; ctx.fillRect(-rx * 1.7, -rx * 1.7, rx * 3.4, rx * 3.4);
    ctx.restore();
    ellipse(rx - 3, ry - 3); ctx.save(); ctx.clip(); // the membrane: brighter towards the rim, with ripples flowing inward
    const fill = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
    fill.addColorStop(0, alpha(color, 0.45)); fill.addColorStop(0.5, alpha(color, 0.08)); fill.addColorStop(1, alpha(color, 0.3));
    ctx.fillStyle = fill; ctx.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
    for (let i = 0; i < 3; i++) {
      const k = mod(time * 0.7 + i / 3, 1);
      ctx.strokeStyle = alpha(color, 0.8 * Math.sin(k * Math.PI)); ctx.lineWidth = 2.5;
      ellipse((rx - 3) * (1 - k), (ry - 3) * (1 - k)); ctx.stroke();
    }
    for (let i = 0; i < 2; i++) { // energy streaks racing around the inside of the rim
      const a = time * 2.6 + i * Math.PI;
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2;
      ellipse(rx * 0.72, ry * 0.88, a, a + 1.1); ctx.stroke();
    }
    ctx.restore();
    for (let i = 0; i < 14; i++) { // sparks being pulled in
      const k = mod(time * 0.8 + i / 14, 1), a = i * 2.4 + time * 0.5, r = 1.7 - k * 1.5, s = 1.5 + k * 3;
      ctx.fillStyle = alpha(i % 3 ? color : '#ffffff', Math.min(1, k * 1.6) * 0.9);
      ctx.fillRect(cx + Math.cos(a) * rx * r * 1.4 - s / 2, cy + Math.sin(a) * ry * Math.min(1, r) - s / 2, s, s);
    }
    ctx.globalCompositeOperation = 'source-over';
    for (const k of [-0.6, 0, 0.6]) { // fins on the back of the frame
      const a = Math.PI + k, bx = cx + Math.cos(a) * rx, by = cy + Math.sin(a) * ry, len = k ? 19 : 27, tilt = Math.sign(Math.sin(a)) * 6;
      poly([[bx + 4, by - 11], [bx - len, by + tilt], [bx + 4, by + 11]], vgrad(by - 11, by + 11, shade(color, 0.2), shade(color, -0.45)), 2.5);
      poly([[bx - 2, by - 4], [bx - len * 0.6, by + tilt * 0.6], [bx - 2, by + 3]], 'rgba(255,255,255,0.45)', 0);
    }
  }
  // The frame: glow and black outline, a shaded band, a bright stripe and an inner highlight.
  const a0 = front ? -Math.PI / 2 : Math.PI / 2, a1 = front ? Math.PI / 2 : Math.PI * 1.5;
  ellipse(rx, ry, a0, a1);
  ctx.shadowColor = color; ctx.shadowBlur = 18; ctx.strokeStyle = '#000'; ctx.lineWidth = 14; ctx.stroke();
  ctx.shadowBlur = 0; ctx.strokeStyle = vgrad(cy - ry, cy + ry, shade(color, 0.45), color, shade(color, -0.4)); ctx.lineWidth = 9; ctx.stroke();
  ellipse(rx + 1.5, ry + 1.5, a0, a1); ctx.strokeStyle = alpha(color, 0.9); ctx.lineWidth = 2.5; ctx.stroke();
  ellipse(rx - 2.5, ry - 2.5, a0, a1); ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2; ctx.stroke();
  if (front) for (const s of [-1, 1]) { // gem caps hide the seams where the halves meet
    const gy = cy + s * ry;
    poly([[cx, gy - 9], [cx + 8, gy], [cx, gy + 9], [cx - 8, gy]], vgrad(gy - 9, gy + 9, shade(color, 0.6), color, shade(color, -0.35)), 2.5);
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(cx - 1.5, gy - 4.5, 3, 3);
  }
  ctx.restore();
}

function drawFinish(fx) {
  if (fx > W + 20 || fx < -100) return;
  const g = ctx.createLinearGradient(fx - 90, 0, fx, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,0.3)');
  ctx.fillStyle = g; ctx.fillRect(fx - 90, 0, 90, GROUND);
  for (let y = 0, i = 0; y < GROUND; y += 10, i++) {
    ctx.fillStyle = i % 2 ? '#111' : '#fff'; ctx.fillRect(fx, y, 6, 10);
    ctx.fillStyle = i % 2 ? '#fff' : '#111'; ctx.fillRect(fx + 6, y, 6, 10);
  }
}

function drawWorld(time) {
  const camX = player.x - PLAYER_SCREEN_X;
  const sx = x => (x - camX) * T, sy = y => GROUND - y * T;
  const hue = level.hue + Math.sin(player.x / 15) * 20;
  const worldParticles = () => drawParticles(particles, q => sx(q.x), q => sy(q.y));
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 36, (Math.random() - 0.5) * shake * 36);
  drawBackground(hue, camX, time);
  drawFloor(hue, camX, GROUND, false);
  if (ceilAnim > 0.01) drawFloor(hue, camX, sy(ROWS) - (1 - ceilAnim) * 100, true);
  ctx.globalAlpha = 0.9; txt(`Attempt ${attempts}`, sx(2.5), sy(5), 46, '#fff', 'left', 8); ctx.globalAlpha = 1;
  drawFinish(sx(level.len));

  const vis = level.tiles.filter(t => t.x > camX - 3 && t.x < camX + W / T + 1);
  drawBlocks(vis.filter(t => t.type === '#'), sx, sy, hue);
  const spikeFill = vgrad(0, T, `hsl(${hue},45%,22%)`, '#050508');
  const portals = [];
  for (const t of vis) {
    const x = sx(t.x), y = sy(t.y + 1);
    switch (t.type) {
      case '^': case 'v': drawSpike(x, y, t.type === 'v', hue, spikeFill); break;
      case 'p': drawPad(x, y, time); break;
      case 'o': drawOrb(x, y, player.used.includes(t.id), time); break;
      case 'c': if (!player.coins.includes(t.id)) drawCoin(x, y, (save.coins[selected] || []).includes(t.id), time); break;
      case 'S': case 'C': case 'B': case 'W': if (t.tall) { drawPortal(t, x, y, false, time); portals.push([t, x, y]); } break;
    }
  }
  if (state !== 'dead') {
    const cx = q => sx(q.x) + T / 2, cy = q => sy(q.y) - T / 2;
    drawTrail(history, skin('trail').name, cx, cy, 1, time, (q, x, y) => ICON[q.mode](x, y, q.rot, skin(q.mode), T));
    if (player.mode === 'wave') drawWaveTrail(history, cx, cy, mainColor(skin('wave')));
    if (player.mode === 'ship' && state === 'play') drawFlame(cx(player), cy(player), player.rot, holding);
    ICON[player.mode](cx(player), cy(player), visRot, skin(player.mode), T, true);
  }
  for (const [t, x, y] of portals) drawPortal(t, x, y, true, time);
  if (state !== 'win') worldParticles();
  ctx.restore();

  ctx.fillStyle = VIGNETTE; ctx.fillRect(0, 0, W, H);
  if (state === 'dead') {
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, 0.35 - stateTime) * (REDUCED_MOTION ? 0.3 : 1)})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
  if (state === 'win') { drawWinPanel(); worldParticles(); }
}

function drawHUD() {
  const pct = progress(), bx = W / 2 - 150, by = 14;
  rr(bx, by, 300, 14, 7); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  if (pct > 0) { rr(bx + 2, by + 2, Math.max(10, 296 * pct / 100), 10, 5); ctx.fillStyle = vgrad(by, by + 14, '#c3ff7a', '#3fcf2a'); ctx.fill(); }
  txt(`${pct}%`, bx + 345, by + 15, 22, '#fff', 'center', 5);
  txt(level.name, 16, 32, 22, '#fff', 'left', 5);
  const banked = save.coins[selected] || [];
  level.coinTiles.forEach((c, i) => drawCoinIcon(W - 24 - i * 28, 24, 10, player.coins.includes(c.id) ? 'new' : banked.includes(c.id) ? 'old' : 'none'));
}

function drawWinPanel() {
  const a = Math.min(1, stateTime * 3);
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
  const pw = 500, ph = 240, px = W / 2 - pw / 2, py = H / 2 - ph / 2 + (1 - a) * 40;
  rr(px, py, pw, ph, 20); ctx.fillStyle = vgrad(py, py + ph, 'rgba(44,38,90,0.96)', 'rgba(16,14,34,0.96)'); ctx.fill();
  ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 3; ctx.stroke();
  txt('LEVEL COMPLETE!', W / 2, py + 64, 46, vgrad(py + 28, py + 64, '#fff7b0', '#ffd400', '#ff7a00'), 'center', 8);
  ui(`${level.name} · ${attempts} attempt${attempts > 1 ? 's' : ''}`, W / 2, py + 100, 16, 'rgba(255,255,255,0.85)');
  const got = save.coins[selected] || [];
  level.coinTiles.forEach((c, i) => drawCoinIcon(W / 2 - (level.coinTiles.length - 1) * 18 + i * 36, py + 134, 13, got.includes(c.id) ? 'new' : 'none'));
  ctx.font = `26px ${FONT}`; // shrink a long note (several unlocks) to fit the panel
  if (winNote) txt(winNote, W / 2, py + 186, Math.min(26, 26 * (pw - 40) / ctx.measureText(winNote).width), '#ffd400', 'center', 5);
  ctx.globalAlpha = a * (0.6 + 0.4 * Math.sin(stateTime * 5));
  ui('Press jump for the menu', W / 2, py + ph - 16, 14, '#fff');
  ctx.restore();
}

// ---- Menu and shop ----
const CARD_W = 200, CARD_H = 188, CARD_Y = 152, CARD_STEP = 224; // the level cards slide like a carousel
const cardRect = i => ({ x: W / 2 - CARD_W / 2 + (i - menuScroll) * CARD_STEP, y: CARD_Y, w: CARD_W, h: CARD_H });
const PREV_BTN = { x: 12, y: CARD_Y + 66, w: 44, h: 56 }, NEXT_BTN = { x: W - 56, y: CARD_Y + 66, w: 44, h: 56 };
const SHOP_BTN = { x: W / 2 - 110, y: 368, w: 220, h: 54 };
const BACK_BTN = { x: 16, y: 12, w: 104, h: 36 };
const TITLE_BOX = { x: W / 2 - 260, y: 38, w: 520, h: 80 };
const GRID_X = 77, GRID_W = 806, GAP = 8, COLS = 8, BOX_W = (GRID_W - (COLS - 1) * GAP) / COLS, BOX_H = 94, TAB_W = (GRID_W - 5 * GAP) / 6;
const tabPos = i => ({ x: GRID_X + i * (TAB_W + GAP), y: 60, w: TAB_W, h: 40 });
const boxPos = i => ({ x: GRID_X + (i % COLS) * (BOX_W + GAP), y: 110 + Math.floor(i / COLS) * (BOX_H + GAP), w: BOX_W, h: BOX_H });
const STAGE = { x: GRID_X, y: 316, w: GRID_W, h: 124 };
const inBox = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
function hovered(b) { const h = inBox(b, mouse.x, mouse.y); if (h) cursorHot = true; return h; }

function drawBalance() {
  const x = W - 196, y = 12;
  rr(x, y, 180, 36, 18); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.stroke();
  drawStar(x + 24, y + 18, 10); txt(String(starBalance()), x + 40, y + 27, 22, '#fff', 'left', 4);
  drawCoinIcon(x + 106, y + 18, 10, 'new'); txt(String(coinBalance()), x + 122, y + 27, 22, '#fff', 'left', 4);
}

function drawRunner(time) { // the equipped cube hopping along the menu floor
  const x = mod(time * 160, W + 120) - 60, ph = mod(time * 1.25, 1), air = ph < 0.42;
  const jump = air ? Math.sin(ph / 0.42 * Math.PI) : 0, rot = (Math.floor(time * 1.25) + Math.min(1, ph / 0.42)) * Math.PI / 2;
  drawCube(x, GROUND - T / 2 - jump * 70, rot, skin('cube'), T, true);
}

function drawMenu(time) {
  const hue = 225 + Math.sin(time * 0.12) * 45, camX = time * 3;
  drawBackground(hue, camX, time);
  drawFloor(hue, camX, GROUND, false);
  drawRunner(time);
  ctx.fillStyle = VIGNETTE; ctx.fillRect(0, 0, W, H);
  drawBalance();
  const bob = Math.sin(time * 2) * 4, jitter = titleClicks ? (Math.random() - 0.5) * titleClicks * 3 : 0;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowOffsetY = 6;
  txt('DEOMETRY GASH', W / 2 + jitter, 102 + bob, 66, vgrad(52 + bob, 102 + bob, '#fff7b0', '#ffd400', '#ff7a00'), 'center', 10);
  ctx.restore();
  ui('← → to choose · Enter or click to play · S opens the shop', W / 2, 136, 14, 'rgba(255,255,255,0.8)');

  LEVELS.forEach((l, i) => {
    const { x } = cardRect(i);
    if (x > W || x + CARD_W < 0) return;
    const sel = i === selected, hot = hovered(cardRect(i)), y = CARD_Y - (sel ? 6 : hot ? 3 : 0), cx = x + CARD_W / 2;
    ctx.save(); ctx.globalAlpha = Math.max(0.3, 1 - Math.abs(i - menuScroll) * 0.28); // cards fade toward the edges
    ctx.save();
    if (sel) { ctx.shadowColor = '#ffd400'; ctx.shadowBlur = 22; } else { ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 6; }
    rr(x, y, CARD_W, CARD_H, 16);
    ctx.fillStyle = vgrad(y, y + CARD_H, `hsl(${l.hue},65%,${sel ? 46 : 38}%)`, `hsl(${l.hue},70%,${sel ? 22 : 16}%)`); ctx.fill();
    ctx.restore();
    ctx.save(); rr(x, y, CARD_W, CARD_H, 16); ctx.clip(); // glossy top
    ctx.fillStyle = vgrad(y, y + CARD_H * 0.45, 'rgba(255,255,255,0.2)', 'rgba(255,255,255,0)'); ctx.fillRect(x, y, CARD_W, CARD_H * 0.45);
    ctx.restore();
    rr(x, y, CARD_W, CARD_H, 16); ctx.strokeStyle = sel ? '#ffd400' : hot ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.35)'; ctx.lineWidth = sel ? 4 : 2; ctx.stroke();
    txt(l.name, cx, y + 36, 24, '#fff', 'center', 5);
    drawFace(cx, y + 80, 21, l.difficulty);
    txt(l.difficulty, cx, y + 122, 18, shade(FACE[l.difficulty], 0.45), 'center', 4);
    drawStar(cx - 42, y + 140, 8); txt(String(l.stars), cx - 30, y + 146, 18, '#fff', 'left', 4);
    const got = save.coins[i] || [];
    l.coinTiles.forEach((c, j) => drawCoinIcon(cx + 16 + j * 22, y + 140, 8, got.includes(c.id) ? 'new' : 'none'));
    const b = save.best[i] || 0;
    rr(x + 20, y + 156, CARD_W - 40, 9, 4.5); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
    if (b) { rr(x + 20, y + 156, Math.max(9, (CARD_W - 40) * b / 100), 9, 4.5); ctx.fillStyle = b === 100 ? '#ffd400' : '#6dff5a'; ctx.fill(); }
    ui(b === 100 ? 'Complete!' : `Best ${b}%`, cx, y + 181, 13, '#fff');
    ctx.restore();
  });
  for (const [b, d] of [[PREV_BTN, -1], [NEXT_BTN, 1]]) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    rr(b.x, b.y, b.w, b.h, 12); ctx.fillStyle = hovered(b) ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.5)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
    poly([[cx - d * 6, cy - 11], [cx + d * 8, cy], [cx - d * 6, cy + 11]], '#fff', 2.5);
  }
  LEVELS.forEach((_, i) => {
    ctx.beginPath(); ctx.arc(W / 2 + (i - (LEVELS.length - 1) / 2) * 18, 354, i === selected ? 5 : 3.5, 0, TAU);
    ctx.fillStyle = i === selected ? '#ffd400' : 'rgba(255,255,255,0.45)'; ctx.fill();
  });

  const sb = SHOP_BTN, lift = hovered(sb) ? 3 : 0, by = sb.y - lift;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowOffsetY = 5; ctx.shadowBlur = 8;
  rr(sb.x, by, sb.w, sb.h, 16); ctx.fillStyle = vgrad(by, by + sb.h, '#9dff6a', '#2fb52a'); ctx.fill();
  ctx.restore();
  rr(sb.x, by, sb.w, sb.h, 16); ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
  rr(sb.x + 6, by + 5, sb.w - 12, sb.h / 2 - 5, 10); ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();
  txt('SHOP', W / 2, by + 37, 30, '#fff', 'center', 6);
  drawCube(sb.x + 34, by + sb.h / 2, Math.sin(time * 2) * 0.12, skin('cube'), 28);
  drawShip(sb.x + sb.w - 36, by + sb.h / 2 + 2, Math.sin(time * 2 + 1) * 0.1, skin('ship'), 30);
  ui(`Coins found ${sum(Object.values(save.coins), c => c.length)}/${totalCoins}   ·   Secrets found ${save.secrets.length}/${Object.keys(SECRETS).length}`, W / 2, 466, 13, 'rgba(255,255,255,0.75)');
}

function fitText(s, size, maxW) { ctx.font = `600 ${size}px system-ui, sans-serif`; return Math.min(size, size * maxW / ctx.measureText(s).width); }
function drawCost(it, cx, y) {
  if (it.stars || it.coins) {
    if (it.stars) drawStar(cx - 10, y - 5, 7); else drawCoinIcon(cx - 10, y - 5, 7, 'new');
    txt(String(it.stars || it.coins), cx + 2, y + 1, 16, '#ffd400', 'left', 3);
  } else {
    const s = it.level !== undefined ? `Beat ${LEVELS[it.level].name}` : 'Secret';
    ui(s, cx, y, fitText(s, 10.5, BOX_W - 10), '#ffd400');
  }
}

function drawShop(time) {
  const hue = 260 + Math.sin(time * 0.12) * 40;
  drawBackground(hue, time * 2, time);
  drawFloor(hue, time * 2, GROUND, false);
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = VIGNETTE; ctx.fillRect(0, 0, W, H);
  const bb = BACK_BTN, hot = hovered(bb);
  rr(bb.x, bb.y, bb.w, bb.h, 12); ctx.fillStyle = hot ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.4)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.stroke();
  txt('← Back', bb.x + bb.w / 2, bb.y + 25, 19, '#fff', 'center', 4);
  txt('SHOP', W / 2, 46, 40, vgrad(14, 46, '#fff7b0', '#ffd400', '#ff7a00'), 'center', 7);
  drawBalance();

  KINDS.forEach((k, i) => {
    const b = tabPos(i), on = i === shopTab, n = ITEMS[k].filter((_, j) => unlocked(k, j)).length;
    rr(b.x, b.y, b.w, b.h, 12);
    ctx.fillStyle = on ? vgrad(b.y, b.y + b.h, '#ffe46b', '#ff9d00') : hovered(b) ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.42)'; ctx.fill();
    ctx.strokeStyle = on ? '#000' : 'rgba(255,255,255,0.3)'; ctx.lineWidth = on ? 2.5 : 2; ctx.stroke();
    txt(KIND_LABEL[k], b.x + 12, b.y + 27, 19, '#fff', 'left', 4);
    ui(`${n}/${ITEMS[k].length}`, b.x + b.w - 10, b.y + 25, 12, on ? '#4a2400' : 'rgba(255,255,255,0.7)', 'right');
  });

  const kind = KINDS[shopTab];
  ITEMS[kind].forEach((it, i) => {
    const b = boxPos(i), open = unlocked(kind, i), on = save.equipped[kind] === i, sel = i === shopPick, hot = hovered(b);
    const cx = b.x + b.w / 2, cy = b.y + 36 + (sel ? Math.sin(time * 4) * 3 : 0);
    ctx.save();
    if (sel) { ctx.shadowColor = '#ffd400'; ctx.shadowBlur = 18; }
    rr(b.x, b.y, b.w, b.h, 12);
    ctx.fillStyle = on ? vgrad(b.y, b.y + b.h, '#2f6b3a', '#173a22') : hot ? vgrad(b.y, b.y + b.h, '#3d3d6e', '#24243f') : vgrad(b.y, b.y + b.h, '#2c2c50', '#1a1a30');
    ctx.fill();
    ctx.restore();
    rr(b.x, b.y, b.w, b.h, 12); ctx.strokeStyle = sel ? '#ffd400' : on ? '#6dff5a' : 'rgba(255,255,255,0.25)'; ctx.lineWidth = sel ? 3.5 : 2; ctx.stroke();
    ctx.globalAlpha = open ? 1 : 0.35;
    if (kind === 'trail') drawTrailIcon(it.name, cx, cy);
    else if (kind === 'death') drawDeathIcon(it.name, cx, cy);
    else ICON[kind](cx, cy, !sel ? 0 : kind === 'ball' ? time * 4 : Math.sin(time * 2) * 0.2, it, kind === 'ship' ? 50 : 40);
    ctx.globalAlpha = 1;
    if (!open) drawLock(b.x + b.w - 15, b.y + 16);
    if (on) drawCheck(b.x + b.w - 14, b.y + 14);
    ui(open || !it.secret ? it.name : '???', cx, b.y + 72, 13, '#fff');
    if (on) ui('Equipped', cx, b.y + 88, 11, '#6dff5a');
    else if (open) ui('Equip', cx, b.y + 88, 11, 'rgba(255,255,255,0.75)');
    else drawCost(it, cx, b.y + 88);
  });
  drawStage(time);
  ui(describe(kind, shopPick), W / 2, 466, 14, '#fff');
}

// The shop's stage plays the picked item on a little floor: the icon in its mode, the trail, or the death effect.
const ST = 30, SP = 7, STAGE_ROWS = 3, LANE_X = STAGE.x + 250, RUN_X = LANE_X + 300; // tile size, speed, height, lane start, icon x
let stageParticles = [], stageClock = 0;
function stageLook() {
  const kind = KINDS[shopTab], it = ITEMS[kind][shopPick], mode = MODE_KINDS.includes(kind) ? kind : 'cube';
  return { mode, icon: kind === mode ? it : skin(mode), trail: kind === 'trail' ? it.name : skin('trail').name, death: kind === 'death' ? it.name : null };
}
const stageTime = L => L.death ? Math.floor(stageClock / 2.2) * 1.2 + Math.min(mod(stageClock, 2.2), 1.2) : stageClock; // dies at 1.2 s, respawns at 2.2 s
function stagePose(mode, t) { // height above the floor (tiles) and rotation at time t
  const top = STAGE_ROWS - 1;
  if (mode === 'ship') return { y: 1.1 + Math.sin(t * 2.2) * 0.9, rot: -Math.cos(t * 2.2) * 0.35 };
  if (mode === 'wave') { const k = mod(t * SP / top, 2); return { y: (k < 1 ? k : 2 - k) * top, rot: k < 1 ? -Math.PI / 4 : Math.PI / 4 }; }
  if (mode === 'ball') { const k = mod(t, 1.6), up = k < 0.8, f = Math.min(1, Math.max(0, (k % 0.8 - 0.45) / 0.35)) ** 2; return { y: (up ? f : 1 - f) * top, rot: 10 * (up ? k : 1.6 - k) }; }
  const k = mod(t, 0.8), h = k < 0.5 ? 4 * (k / 0.5) * (1 - k / 0.5) : 0;
  return { y: h * 1.5, rot: (Math.floor(t / 0.8) + Math.min(1, k / 0.5)) * Math.PI / 2 };
}
function tickStage() {
  const L = stageLook(), was = mod(stageClock, 2.2);
  stageClock += DT;
  stageParticles = updateParticles(stageParticles);
  const t = stageTime(L), y = (L.death ? 0 : stagePose(L.mode, t).y) + 0.5, now = mod(stageClock, 2.2);
  if (L.death && was < 1.2 && now >= 1.2) deathEffect(stageParticles, t * SP + 0.5, y, L.death, mainColor(L.icon));
  if (!L.death || now < 1.2) emitTrail(stageParticles, t * SP + 0.5, y, L.trail, mainColor(L.icon));
}
function drawStage(time) {
  const S = STAGE, kind = KINDS[shopTab], it = ITEMS[kind][shopPick], L = stageLook(), open = unlocked(kind, shopPick), on = save.equipped[kind] === shopPick;
  rr(S.x, S.y, S.w, S.h, 16); ctx.fillStyle = 'rgba(8,8,22,0.62)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.stroke();
  const name = open || !it.secret ? it.name : '???';
  ctx.font = `32px ${FONT}`; txt(name, S.x + 24, S.y + 58, Math.min(32, 32 * 210 / ctx.measureText(name).width), '#fff', 'left', 6);
  ui(on ? 'Equipped' : open ? 'Unlocked: press Enter to equip' : it.stars ? `Costs ${it.stars} stars` : it.coins ? `Costs ${it.coins} coins` : it.secret ? 'Secret' : `Beat ${LEVELS[it.level].name}`,
    S.x + 24, S.y + 86, 13, on ? '#6dff5a' : '#ffd400', 'left');

  const floor = S.y + S.h - 18, ceil = floor - STAGE_ROWS * ST, t = stageTime(L), x = t * SP, dead = L.death && mod(stageClock, 2.2) >= 1.2;
  const toX = q => RUN_X + (q.x - x) * ST, toY = q => floor - q.y * ST, cx = q => toX(q) + ST / 2, cy = q => toY(q) - ST / 2;
  ctx.save(); ctx.beginPath(); ctx.rect(LANE_X, S.y + 2, S.x + S.w - LANE_X - 2, S.h - 4); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(LANE_X, floor, S.w, S.h);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2;
  for (let gx = LANE_X - mod((x - (RUN_X - LANE_X) / ST) * ST, 2 * ST); gx < S.x + S.w; gx += 2 * ST) ctx.strokeRect(gx + 2, floor + 3, 2 * ST - 4, 2 * ST - 4);
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(LANE_X, floor - 1, S.w, 2);
  if (L.mode !== 'cube') { ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(LANE_X, S.y, S.w, ceil - S.y); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(LANE_X, ceil - 1, S.w, 2); }
  if (L.death) { // the spike it runs into
    ctx.save(); ctx.translate(toX({ x: (Math.floor(stageClock / 2.2) + 1) * 1.2 * SP + 0.6 }), floor - ST); ctx.scale(ST / T, ST / T);
    drawSpike(0, 0, false, 260, vgrad(0, T, 'hsl(260,45%,22%)', '#050508')); ctx.restore();
  }
  const hist = [...Array(41)].map((_, k) => { const tt = t - (40 - k) * DT, q = L.death ? { y: 0, rot: 0 } : stagePose(L.mode, tt); return { x: tt * SP, y: q.y, mode: L.mode, rot: q.rot }; });
  const me = hist[hist.length - 1];
  if (!dead) {
    drawTrail(hist, L.trail, cx, cy, ST / T, time, (q, x, y) => ICON[q.mode](x, y, q.rot, L.icon, ST));
    if (L.mode === 'wave') drawWaveTrail(hist, cx, cy, mainColor(L.icon), ST / T);
    if (L.mode === 'ship') { ctx.save(); ctx.translate(cx(me), cy(me)); ctx.scale(ST / T, ST / T); drawFlame(0, 0, me.rot, true); ctx.restore(); }
    ICON[L.mode](cx(me), cy(me), me.rot, L.icon, ST, true);
  }
  drawParticles(stageParticles, toX, toY, ST / T);
  ctx.restore();
}

function drawToast() {
  if (!toast) return;
  const a = Math.max(0, Math.min(1, toast.t * 3, (2.5 - toast.t) * 6));
  ctx.font = `18px ${FONT}`;
  const w = ctx.measureText(toast.text).width + 56, y = H - 46 + (1 - a) * 20;
  ctx.save(); ctx.globalAlpha = a;
  rr(W / 2 - w / 2, y, w, 36, 18); ctx.fillStyle = 'rgba(12,10,24,0.92)'; ctx.fill();
  ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 2; ctx.stroke();
  drawStar(W / 2 - w / 2 + 22, y + 18, 8);
  txt(toast.text, W / 2 + 12, y + 25, 18, '#ffd400', 'center');
  ctx.restore();
}

// ---- Loop ----
let last = performance.now(), acc = 0, clock = 0;
function frame(now) {
  acc += Math.min(0.25, (now - last) / 1000); last = now;
  while (acc >= DT) {
    acc -= DT; stateTime += DT; clock += DT;
    if (toast && (toast.t -= DT) <= 0) toast = null;
    shake = Math.max(0, shake - DT);
    particles = updateParticles(particles);
    ceilAnim += ((player.mode !== 'cube' ? 1 : 0) - ceilAnim) * 0.12;
    menuScroll += (selected - menuScroll) * 0.18;
    if (state === 'play') {
      const prev = { grounded: player.grounded, vy: player.vy, mode: player.mode, grav: player.grav, used: player.used.length, coins: player.coins.length };
      const r = step(player, holding, level);
      if (!r) playEffects(prev);
      if (r === 'dead') die();
      if (r === 'win') finishLevel();
      if (r) { state = r; stateTime = 0; }
    } else if (state === 'dead' && stateTime > 0.8) {
      player = newPlayer(); visRot = 0; state = 'play'; attempts++; history = [];
    }
    // ease the cube's landing snap instead of popping to the nearest quarter turn
    visRot = player.mode === 'cube' && player.grounded ? visRot + (player.rot - visRot) * 0.35 : player.rot;
    if (state === 'play') { history.push({ x: player.x, y: player.y, mode: player.mode, rot: visRot }); if (history.length > 60) history.shift(); }
    if (state === 'shop') tickStage();
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cursorHot = false;
  if (state === 'menu') drawMenu(clock); else if (state === 'shop') drawShop(clock); else drawWorld(clock);
  drawToast();
  canvas.style.cursor = cursorHot ? 'pointer' : 'default';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- Input ----
function press() {
  if (state === 'menu') startLevel(selected);
  else if (state === 'shop') buyOrEquip(KINDS[shopTab], shopPick);
  else if (state === 'win' && stateTime > 0.5) state = 'menu';
  else holding = true;
}
function shopSelect(tab, i) { shopTab = tab; shopPick = Math.max(0, Math.min(ITEMS[KINDS[tab]].length - 1, i)); stageClock = 0; stageParticles = []; }
function openShop() { state = 'shop'; shopSelect(shopTab, shopPick); }
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'Enter'];
addEventListener('keydown', e => {
  keys = [...keys, e.code].slice(-KONAMI.length);
  if (keys.join() === KONAMI.join()) unlockSecret('konami');
  if (e.code === 'Escape' || (state === 'shop' && e.code === 'Backspace')) { state = 'menu'; holding = false; return; }
  if ((state === 'menu' || state === 'shop') && e.key.length === 1) {
    typed = (typed + e.key.toLowerCase()).slice(-4);
    if (typed === 'gash') unlockSecret('code');
  }
  if (state === 'menu') {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') selected = mod(selected + (e.code === 'ArrowLeft' ? -1 : 1), LEVELS.length);
    if (e.code === 'KeyS') { openShop(); return; }
  }
  if (state === 'shop') { // up and down switch tabs (landing on what is equipped), left and right pick an item
    const d = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.code];
    if (d) {
      e.preventDefault();
      const tab = Math.max(0, Math.min(KINDS.length - 1, shopTab + d[0]));
      shopSelect(tab, tab !== shopTab ? save.equipped[KINDS[tab]] : shopPick + d[1]);
      return;
    }
  }
  if (JUMP_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
});
addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) holding = false; });
function toCanvas(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
canvas.addEventListener('pointermove', e => { mouse = toCanvas(e); });
canvas.addEventListener('pointerleave', () => { mouse = { x: -1, y: -1 }; });
canvas.addEventListener('pointerdown', e => {
  const { x: mx, y: my } = mouse = toCanvas(e);
  if (state === 'menu') {
    if (inBox(SHOP_BTN, mx, my)) { openShop(); return; }
    if (inBox(PREV_BTN, mx, my) || inBox(NEXT_BTN, mx, my)) { selected = mod(selected + (mx < W / 2 ? -1 : 1), LEVELS.length); return; }
    if (inBox(TITLE_BOX, mx, my) && ++titleClicks >= 7) { titleClicks = 0; unlockSecret('title'); }
    const i = LEVELS.findIndex((_, i) => inBox(cardRect(i), mx, my));
    if (i === selected) startLevel(i); else if (i >= 0) selected = i; // the first click on another card brings it to the middle
    return;
  }
  if (state === 'shop') {
    if (inBox(BACK_BTN, mx, my)) { state = 'menu'; return; }
    KINDS.forEach((k, i) => { if (inBox(tabPos(i), mx, my)) shopSelect(i, save.equipped[k]); });
    ITEMS[KINDS[shopTab]].forEach((_, i) => { if (inBox(boxPos(i), mx, my)) { shopSelect(shopTab, i); buyOrEquip(KINDS[shopTab], i); } });
    return;
  }
  press();
});
addEventListener('pointerup', () => holding = false);
addEventListener('blur', () => holding = false);
</script>
</body>
